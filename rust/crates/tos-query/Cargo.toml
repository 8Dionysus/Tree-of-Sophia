[package]
name = "tos-query"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Explicit owner-opened native models; the shared rules do not need this stack.
native-models = [
    "dep:rusqlite", "dep:tos-compiler", "dep:tos-fd-open", "dep:tos-source-store",
    "dep:tos-validation", "dep:serde_json", "dep:unicode-normalization",
    "dep:unicode-general-category",
]
test-fixture = ["native-models"]

[dependencies]
tos-foundation = { path = "../tos-foundation" }
regex = "1.13.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled", "hooks"], optional = true }
tos-compiler = { path = "../tos-compiler", optional = true }
tos-fd-open = { path = "../tos-fd-open", optional = true }
tos-source-store = { path = "../tos-source-store", optional = true }
tos-validation = { path = "../tos-validation", optional = true }
serde_json = { version = "1", features = ["arbitrary_precision"], optional = true }
unicode-normalization = { version = "=0.1.24", optional = true }
unicode-general-category = { version = "=1.1.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tos-compiler = { path = "../tos-compiler", features = ["test-fixture"] }

[lib]
name = "tos_query"
path = "src/lib.rs"
