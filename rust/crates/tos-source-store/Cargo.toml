[package]
name = "tos-source-store"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []

[dependencies]
tos-foundation = { path = "../tos-foundation" }
tos-fd-open = { path = "../tos-fd-open" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.45", default-features = false }
sha1 = "=0.10.6"
rusqlite = { version = "0.37", features = ["bundled"] }
