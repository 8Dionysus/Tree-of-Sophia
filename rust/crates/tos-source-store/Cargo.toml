[package]
name = "tos-source-store"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Exact readers do not prepare, import, archive or transfer source captures.
capture = ["dep:flate2", "dep:tar", "dep:sha1"]

[dependencies]
tos-foundation = { path = "../tos-foundation" }
tos-fd-open = { path = "../tos-fd-open" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
tar = { version = "=0.4.45", default-features = false, optional = true }
sha1 = { version = "=0.10.6", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
tos-segment-store = { path = "../tos-segment-store" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
tempfile = "3"
