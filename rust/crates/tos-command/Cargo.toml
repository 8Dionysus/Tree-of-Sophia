[package]
name = "tos-command"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
postgres-lab = []

[dependencies]
base64 = "=0.22.1"
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
tos-foundation = { path = "../tos-foundation" }
tos-segment-store = { path = "../tos-segment-store" }
tos-source-store = { path = "../tos-source-store" }
tos-validation = { path = "../tos-validation" }
tos-compiler = { path = "../tos-compiler" }
tos-query = { path = "../tos-query" }
tos-access = { path = "../tos-access" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
postgres = "0.19"
tos-fd-open = { path = "../tos-fd-open" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
unicode-normalization = "=0.1.24"
xml = "=1.4.0"

[dev-dependencies]
tos-compiler = { path = "../tos-compiler", features = ["test-fixture"] }
tempfile = "3"

[lib]
name = "tos_command"
path = "src/lib.rs"

[[test]]
name = "postgres_durable_lab"
required-features = ["postgres-lab"]
