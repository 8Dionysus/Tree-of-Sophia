[package]
name = "tos-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[features]
# Source preparation and managed-source tools are opt-in for reader consumers.
source-tools = ["dep:quick-xml", "dep:tos-validation", "dep:unicode-normalization", "dep:regex", "dep:fs2"]
# Explicit source-selected research builders; excluded from ordinary readers.
research = ["source-tools", "tos-validation/research"]
# Selects the pinned IndexMap allocation envelope for cold raw normalization.
preserve-order-workspace = ["serde_json/preserve_order"]
test-fixture = ["source-tools"]

[dependencies]
quick-xml = { version = "=0.41.0", optional = true }
tos-foundation = { path = "../tos-foundation" }
tos-fd-open = { path = "../tos-fd-open" }
tos-validation = { path = "../tos-validation", optional = true }
tos-source-store = { path = "../tos-source-store" }
tos-segment-store = { path = "../tos-segment-store" }
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
unicode-normalization = { version = "0.1.24", optional = true }
regex = { version = "1", optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Same pinned decoder backend; its public state geometry admits hidden heap
# before the existing flate2 decoder, without a second decoding implementation.
miniz_oxide = "=0.9.1"
fs2 = { version = "0.4", optional = true }
libc = "0.2"

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
name = "tos_compiler"
path = "src/lib.rs"

[[test]]
name = "zarathustra_lexical_unicode_contract"
required-features = ["research"]

[[bin]]
name = "tos-constructor-library"
path = "src/bin/tos-constructor-library.rs"
required-features = ["source-tools"]

[[bin]]
name = "tos-constructor-fragments"
path = "src/bin/tos-constructor-fragments.rs"
required-features = ["source-tools"]
