[package]
name = "tos-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[dependencies]
tos-foundation = { path = "../tos-foundation" }
tos-fd-open = { path = "../tos-fd-open" }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde_json = "1"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"

[lib]
name = "tos_compiler"
path = "src/lib.rs"
