[package]
name = "tos-ops-mechanics-plan"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
csv = "=1.4.0"
jsonschema = { version = "=0.53.0", default-features = false, features = ["arbitrary-precision"] }
num-bigint = "=0.4.8"
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tos-foundation = { path = "../tos-foundation" }
tos-validation = { path = "../tos-validation" }
unicode-general-category = "=1.1.0"
yaml-rust2 = { version = "=0.13.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "tos-ops-mechanics-plan"
path = "src/main.rs"

[[bin]]
name = "tos-validation-lanes"
path = "src/validation_lanes_main.rs"

[[bin]]
name = "tos-release-check"
path = "src/release_check_main.rs"

[[bin]]
name = "tos-software-ci"
path = "src/software_ci_main.rs"

[[bin]]
name = "tos-route-cards"
path = "src/route_cards_main.rs"

[[bin]]
name = "tos-agents-route-harness"
path = "src/route_harness_main.rs"
