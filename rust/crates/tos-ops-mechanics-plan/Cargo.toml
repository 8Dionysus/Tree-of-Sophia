required-features = ["mechanics"]

[[test]]
name = "provider_controls_native"
required-features = ["mechanics"]

[[test]]
name = "mechanics_contracts"
required-features = ["mechanics"]

[[test]]
name = "witness_structure_native"
required-features = ["mechanics"]

[[test]]
name = "stats_release_native"
required-features = ["mechanics"]

[[test]]
name = "documentation_cross_corpus_native"
required-features = ["mechanics"]

[[test]]
name = "agent_surface_native"
required-features = ["mechanics"]

[[test]]
name = "route_harness_native"
required-features = ["mechanics"]

[[test]]
name = "semantic_registry_transition_native"
required-features = ["mechanics"]

[[test]]
name = "kag_publication_native"
