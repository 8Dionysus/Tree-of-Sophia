[workspace]
resolver = "3"
members = [
  "rust/crates/tos-foundation",
  "rust/crates/tos-time-space",
  "rust/crates/tos-source-store",
  "rust/crates/tos-fd-open",
  "rust/crates/tos-compiler",
  "rust/crates/tos-query",
  "rust/crates/tos-access",
  "rust/crates/tos-ops-mechanics-plan",
  "rust/crates/tos-validation",
  "rust/crates/tos-command",
  "rust/crates/tos-web-rules",
  "rust/crates/tos-reader",
  "rust/crates/tos-segment-store",
  "tests/conformance/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[profile.test.package.tos-conformance]
strip = "debuginfo"

# Native commands hash their executing image before admitting source writes.
# Keep SHA intrinsics optimized in dev/test builds used by bounded real-input
# validation; unoptimized SIMD wrappers dominate these short operations.
[profile.dev.package.sha2]
opt-level = 3

# Real package and fixture archives also run in dev/test builds.
# Optimize their Deflate backend while retaining the archive format and level.
[profile.dev.package.miniz_oxide]
opt-level = 3
