name: ToS Immutable Read-only Producer
on:
  workflow_call:
    inputs:
      expected_producer_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable platform binding before privileged host I/O
        env:
          TOS_EXPECTED_PRODUCER_COMMIT: ${{ inputs.expected_producer_commit }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT_NAME: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_CALLER_COMMIT: ${{ github.sha }}
          TOS_CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_ACTUAL_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_ACTUAL_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_ACTUAL_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          /usr/bin/python3 -I -S - <<'PYPRECHECK'
          """Platform coherence before host I/O. External owner selection is separate."""
          import os
          import re
          
          REPOSITORY = '8Dionysus/Tree-of-Sophia'
          PRODUCER_PATH = '.github/workflows/tos-item-readonly-anchor-producer.yml'
          CALLER_PATH = '.github/workflows/tos-item-readonly-anchor-caller.yml'
          BRANCH_PREFIX = 'codex/tos-item-readonly-anchor-'
          
          
          def checked_binding(values):
              producer = values.get('TOS_EXPECTED_PRODUCER_COMMIT', '')
              caller = values.get('TOS_CALLER_COMMIT', '')
              if not re.fullmatch('[0-9a-f]{40}', producer) or not re.fullmatch('[0-9a-f]{40}', caller):
                  raise RuntimeError('immutable object identity absent')
              ref = 'refs/heads/' + BRANCH_PREFIX + caller
              expected = {
                  'TOS_REPOSITORY': REPOSITORY,
                  'TOS_EVENT_NAME': 'push',
                  'TOS_REF': ref,
                  'TOS_CALLER_WORKFLOW_SHA': caller,
                  'TOS_CALLER_WORKFLOW_REF': REPOSITORY + '/' + CALLER_PATH + '@' + ref,
                  'TOS_ACTUAL_PRODUCER_SHA': producer,
                  'TOS_ACTUAL_PRODUCER_REF': REPOSITORY + '/' + PRODUCER_PATH + '@' + producer,
                  'TOS_ACTUAL_PRODUCER_REPOSITORY': REPOSITORY,
                  'TOS_RUNNER_ENVIRONMENT': 'github-hosted',
                  'TOS_RUNNER_OS': 'Linux',
                  'TOS_RUNNER_ARCH': 'X64',
                  'ImageOS': 'ubuntu24',
              }
              mismatches = [name for name, value in expected.items() if values.get(name) != value]
              if mismatches:
                  raise RuntimeError('source/platform launch binding mismatch before host I/O: '
                                     + ','.join(mismatches))
              return {'binding_check': 'platform-coherent', 'producer_commit': producer,
                      'producer_workflow': expected['TOS_ACTUAL_PRODUCER_REF'],
                      'caller_commit': caller, 'caller_workflow': expected['TOS_CALLER_WORKFLOW_REF'],
                      'activation_ref': ref,
                      'authority': 'external owner review and exact create-only ref selection; not this record',
                      'operational_admission': False}
          
          checked_binding(os.environ)
          print('Platform source binding coherent; no host diagnostic I/O in this step.')
          PYPRECHECK
      - name: Read bounded metadata from the immutable producer
        env:
          TOS_EXPECTED_PRODUCER_COMMIT: ${{ inputs.expected_producer_commit }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT_NAME: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_CALLER_COMMIT: ${{ github.sha }}
          TOS_CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_ACTUAL_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_ACTUAL_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_ACTUAL_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set +e
          sudo -n --preserve-env=ImageOS,ImageVersion,TOS_EXPECTED_PRODUCER_COMMIT,TOS_REPOSITORY,TOS_EVENT_NAME,TOS_REF,TOS_CALLER_COMMIT,TOS_CALLER_WORKFLOW_SHA,TOS_CALLER_WORKFLOW_REF,TOS_ACTUAL_PRODUCER_SHA,TOS_ACTUAL_PRODUCER_REF,TOS_ACTUAL_PRODUCER_REPOSITORY,TOS_RUNNER_ENVIRONMENT,TOS_RUNNER_OS,TOS_RUNNER_ARCH \
            /usr/bin/python3 -I -S - \
            > "$RUNNER_TEMP/tos-anchor-metadata.json" \
            2> "$RUNNER_TEMP/tos-anchor-producer.log" <<'PYPRODUCER'
          """Platform coherence before host I/O. External owner selection is separate."""
          import os
          import re
          
          REPOSITORY = '8Dionysus/Tree-of-Sophia'
          PRODUCER_PATH = '.github/workflows/tos-item-readonly-anchor-producer.yml'
          CALLER_PATH = '.github/workflows/tos-item-readonly-anchor-caller.yml'
          BRANCH_PREFIX = 'codex/tos-item-readonly-anchor-'
          
          
          def checked_binding(values):
              producer = values.get('TOS_EXPECTED_PRODUCER_COMMIT', '')
              caller = values.get('TOS_CALLER_COMMIT', '')
              if not re.fullmatch('[0-9a-f]{40}', producer) or not re.fullmatch('[0-9a-f]{40}', caller):
                  raise RuntimeError('immutable object identity absent')
              ref = 'refs/heads/' + BRANCH_PREFIX + caller
              expected = {
                  'TOS_REPOSITORY': REPOSITORY,
                  'TOS_EVENT_NAME': 'push',
                  'TOS_REF': ref,
                  'TOS_CALLER_WORKFLOW_SHA': caller,
                  'TOS_CALLER_WORKFLOW_REF': REPOSITORY + '/' + CALLER_PATH + '@' + ref,
                  'TOS_ACTUAL_PRODUCER_SHA': producer,
                  'TOS_ACTUAL_PRODUCER_REF': REPOSITORY + '/' + PRODUCER_PATH + '@' + producer,
                  'TOS_ACTUAL_PRODUCER_REPOSITORY': REPOSITORY,
                  'TOS_RUNNER_ENVIRONMENT': 'github-hosted',
                  'TOS_RUNNER_OS': 'Linux',
                  'TOS_RUNNER_ARCH': 'X64',
                  'ImageOS': 'ubuntu24',
              }
              mismatches = [name for name, value in expected.items() if values.get(name) != value]
              if mismatches:
                  raise RuntimeError('source/platform launch binding mismatch before host I/O: '
                                     + ','.join(mismatches))
              return {'binding_check': 'platform-coherent', 'producer_commit': producer,
                      'producer_workflow': expected['TOS_ACTUAL_PRODUCER_REF'],
                      'caller_commit': caller, 'caller_workflow': expected['TOS_CALLER_WORKFLOW_REF'],
                      'activation_ref': ref,
                      'authority': 'external owner review and exact create-only ref selection; not this record',
                      'operational_admission': False}
          
          import base64,hashlib,sys,zlib
          binding=checked_binding(os.environ)
          if os.geteuid()!=0 or not sys.flags.isolated or not sys.flags.no_site:
              raise RuntimeError('isolated system root interpreter required before host I/O')
          packed=base64.b64decode('',validate=True)
          decoder=zlib.decompressobj()
          raw=decoder.decompress(packed,262144)
          if not decoder.eof or decoder.unconsumed_tail or decoder.unused_data or hashlib.sha256(raw).hexdigest()!='54bfeeca9148d74c0639d6b564f986d11d386950f9f763e7431a72cef1d0040d':
              raise RuntimeError('immutable producer payload differs; no host I/O')
          scope={'__name__':'_immutable_producer_payload'}
          exec(compile(raw,'<immutable-producer-payload>','exec'),scope)
          raise SystemExit(scope['run'](binding))
          
          PYPRODUCER
          diagnostic_code=$?
          set -e
          /usr/bin/python3 -I -S - "$diagnostic_code" "$RUNNER_TEMP/tos-anchor-metadata.json" "$RUNNER_TEMP/tos-anchor-producer.log" <<'PYVERIFY'
          import hashlib,json,re,sys
          with open(sys.argv[3],'rb') as stream: pin=stream.read(8193)
          assert len(pin)<=8192
          print(pin.decode('utf-8'),end='',flush=True)
          assert sys.argv[1]=='79', 'bounded diagnostic did not complete'
          match=re.fullmatch(rb'TOS_ANCHORED_DIAGNOSTIC_SHA256 ([0-9a-f]{64}) bytes=([0-9]+)\n',pin)
          assert match
          with open(sys.argv[2],'rb') as stream: wire=stream.read(524289)
          assert len(wire)<=524288 and len(wire)==int(match[2]) and hashlib.sha256(wire).hexdigest()==match[1].decode()
          value=json.loads(wire)
          assert value['outcome']=='diagnostic-only' and value['diagnostic_exit_code']==79
          for field in ('ticket_issued','namespace_attempted','policy_changed','source_closure_proven','attachment_admission','policy_source_bytes_exported'):
              assert value[field] is False
          assert value['immutable_launch_binding']['binding_check']=='platform-coherent'
          print('Completed metadata-only read; external authority separate; PG NOTRUN.')
          PYVERIFY
      - name: Preserve metadata and producer digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tos-item-readonly-anchor-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/tos-anchor-metadata.json
            ${{ runner.temp }}/tos-anchor-producer.log
      - name: Keep operational admission closed
        if: always()
        run: exit 125
