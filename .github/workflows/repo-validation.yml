      - name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - name: Verify and bind exact native CI executors
        run: |
          python - <<'PY_OPS'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tos-ci-executors'
          manifest = json.loads((root / 'manifest.json').read_text())
          expected = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
                      'toolchain': '1.98.1', 'target': 'x86_64-unknown-linux-gnu', 'profile': 'debug', 'features': []}
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit('native CI executor identity mismatch: ' + key)
          names = ('tos-release-check', 'tos-validation-lanes', 'tos-software-ci')
          if set(manifest['binaries']) != set(names):
              raise SystemExit('native CI executor set mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name in names:
                  path = root / name
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit('native CI executor is not a regular file: ' + name)
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if manifest['binaries'][name] != {'sha256': digest, 'size_bytes': path.stat().st_size}:
                      raise SystemExit('native CI executor bytes mismatch: ' + name)
                  path.chmod(0o500)
                  env.write(name.upper().replace('-', '_') + '_EXECUTOR=' + str(path) + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as path_env:
              path_env.write(str(root) + '\n')
          PY_OPS
      - name: Setup Python for Unicode 16 differential oracles
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install maintained Python fixture dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Setup Node for generated WebAssembly host
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install verified wasm-bindgen CLI
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify Rust workspace, conformance products and isolated install
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          CARGO_BUILD_JOBS: "2"
          TOS_NATIVE_OWNER_COMMAND_PATH: ${{ runner.temp }}/cargo-target/debug/tos-native-owner-command
          TOS_NATIVE_PREPARED_CONSUMER_BIN: ${{ runner.temp }}/cargo-target/debug/tos-access
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
        run: python scripts/validation_lanes.py --run rust_workspace
      - name: Verify durable command transactions against PostgreSQL
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          CARGO_BUILD_JOBS: "2"
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
          TOS_CMD_POSTGRES_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_lab
        run: |
          : "${TOS_CMD_POSTGRES_URL:?dedicated PostgreSQL connection is required}"
          cargo test -p tos-command --features postgres-lab --test postgres_durable_lab --locked -- --nocapture

