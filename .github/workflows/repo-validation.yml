      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Frozen SQLite fixture files were captured with SQLite 3.51.2.
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: access/deploy/cloudflare-worker/package-lock.json

      - name: Prepare pinned Worker rules
        env:
          CARGO_HOME: ${{ runner.temp }}/worker-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/worker-cargo-target
          CARGO_BUILD_JOBS: "2"
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.98.1 build --locked -p tos-access --bin tos-access --target x86_64-unknown-linux-gnu
          cargo +1.98.1 build --locked -p tos-validation --bin tos-schema-worker --target x86_64-unknown-linux-gnu
          cargo +1.98.1 build --locked --release -p tos-web-rules --features wasm --target wasm32-unknown-unknown
          archive="$RUNNER_TEMP/worker-wasm-bindgen.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-name tos_web_rules --out-dir access/deploy/cloudflare-worker/generated \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tos_web_rules.wasm"

      - name: Test Worker contracts without deployment or production data
        env:
          TOS_ACCESS_BIN: ${{ runner.temp }}/worker-cargo-target/x86_64-unknown-linux-gnu/debug/tos-access
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/worker-cargo-target/x86_64-unknown-linux-gnu/debug/tos-schema-worker
        run: |
          test -x "$TOS_ACCESS_BIN"
          node --input-type=module -e 'import { strict as assert } from "node:assert"; assert.equal(process.versions.sqlite, "3.51.2", "frozen SQLite fixture engine");'
          npm ci --prefer-offline --no-audit --no-fund --prefix access/deploy/cloudflare-worker
          npm run typecheck --prefix access/deploy/cloudflare-worker
          npm test --prefix access/deploy/cloudflare-worker

