name: Repo Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# One native CI profile for owner binaries, same-run executors and test consumers.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  TOS_GROWTH_JOBS: "2"

concurrency:
  group: repo-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks and validate changed documentation
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    outputs:
      software_mode: ${{ steps.select.outputs.software_mode }}
      worker: ${{ steps.select.outputs.worker }}
      rust: ${{ steps.select.outputs.rust }}
      executor_sha256: ${{ steps.executors.outputs.executor_sha256 }}
      executor_manifest_sha256: ${{ steps.executors.outputs.executor_manifest_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check AGENTS.md word limits
        run: |
          git ls-files -z '*AGENTS.md' | LC_ALL=C xargs -0 wc -w | awk '$NF != "total" && $1 > 800 { print; failed = 1 } END { exit failed }'
      - name: Test source CI proof adapter
        run: node --test .github/scripts/verified-pr-tree.test.mjs
      - name: Verify prior PR source CI for the landed tree
        id: main_ci
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        timeout-minutes: 2
        continue-on-error: true
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { verifiedPrTree } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/verified-pr-tree.mjs`).href);
            core.setOutput('validated_tree', await verifiedPrTree({ github, context, core }));
      - name: Identify Cargo cache platform
        id: cargo_platform
        run: |
          . /etc/os-release
          printf 'image=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf 'CARGO_HOME=%s/plan-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/plan-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore optional plan Cargo libraries
        id: cargo_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/plan-cargo-home/registry
            ${{ runner.temp }}/plan-cargo-target/**/.fingerprint
            ${{ runner.temp }}/plan-cargo-target/**/build
            ${{ runner.temp }}/plan-cargo-target/**/deps/*.rlib
            ${{ runner.temp }}/plan-cargo-target/**/deps/*.rmeta
            ${{ runner.temp }}/plan-cargo-target/**/deps/*.so
            ${{ runner.temp }}/plan-cargo-target/**/deps/*.d
          key: tos-cargo-lib-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo_platform.outputs.image }}-rust1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/crates/**/Cargo.toml', 'tests/conformance/rust/Cargo.toml') }}-plan-native-nodefault-mechanics-debug0-${{ steps.cargo_platform.outputs.source_tree }}
          restore-keys: |
            tos-cargo-lib-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo_platform.outputs.image }}-rust1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/crates/**/Cargo.toml', 'tests/conformance/rust/Cargo.toml') }}-plan-native-nodefault-mechanics-debug0-
      - name: Prepare exact native CI executors
        id: executors
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if cargo +1.98.1 build --locked --no-default-features -p tos-ops-mechanics-plan \
            --bin tos-release-check --bin tos-validation-lanes --bin tos-software-ci \
            --target x86_64-unknown-linux-gnu --message-format=json > "$RUNNER_TEMP/plan-cargo-messages.jsonl"; then
            :
          else
            cargo_status=$?
            cat "$RUNNER_TEMP/plan-cargo-messages.jsonl" >&2 || true
            exit "$cargo_status"
          fi
          mkdir "$RUNNER_TEMP/tos-ci-executors"
          cp "$CARGO_TARGET_DIR"/x86_64-unknown-linux-gnu/debug/tos-{release-check,validation-lanes,software-ci} "$RUNNER_TEMP/tos-ci-executors/"
          rustc +1.98.1 --version > "$RUNNER_TEMP/plan-rustc-version.txt"
          "$RUNNER_TEMP/tos-ci-executors/tos-software-ci" executor-manifest \
            --repo-root "$GITHUB_WORKSPACE" --artifact-root "$RUNNER_TEMP/tos-ci-executors" \
            --image-root "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug" \
            --cargo-messages "$RUNNER_TEMP/plan-cargo-messages.jsonl" \
            --rustc-version "$RUNNER_TEMP/plan-rustc-version.txt" --github-output "$GITHUB_OUTPUT"
          printf 'TOS_SOFTWARE_CI_EXECUTOR=%s\n' "$RUNNER_TEMP/tos-ci-executors/tos-software-ci" >> "$GITHUB_ENV"
      - name: Preserve same-run native CI executors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors/
          if-no-files-found: error
          retention-days: 1
      - name: Select checks from both sides of the exact change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
          VALIDATED_TREE: ${{ steps.main_ci.outputs.validated_tree }}
        run: |
          if [ "$FULL_RELEASE" = true ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            "$TOS_SOFTWARE_CI_EXECUTOR" plan --repo-root "$GITHUB_WORKSPACE" --base HEAD --full
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            args=()
            if [ -n "$VALIDATED_TREE" ]; then
              args+=(--validated-tree "$VALIDATED_TREE")
            fi
            "$TOS_SOFTWARE_CI_EXECUTOR" plan --repo-root "$GITHUB_WORKSPACE" --base "$BASE_SHA" "${args[@]}"
          fi

  software_prepare:
    needs: plan
    if: ${{ needs.plan.outputs.software_mode != 'none' }}
    name: Prepare exact Software inputs
    # Match the Ubuntu 26.04 baseline and both consumers of these host images.
    runs-on: ubuntu-26.04
    outputs:
      software_stage_manifest_sha256: ${{ steps.stage.outputs.software_stage_manifest_sha256 }}
    steps:
      - name: Checkout software and bounded test fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - &configure_software_cargo
        name: Configure Cargo paths
        run: |
          printf 'CARGO_HOME=%s/software-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          # Test features cannot replace images already bound by package receipts.
          printf 'CARGO_TARGET_DIR=%s/software-test-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - &fetch_software_ci_executors
        name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - &bind_software_ci_executors
        name: Verify and bind exact native CI executors
        env:
          TOS_CI_EXECUTOR_SHA256: ${{ needs.plan.outputs.executor_sha256 }}
          TOS_CI_MANIFEST_SHA256: ${{ needs.plan.outputs.executor_manifest_sha256 }}
        run: |
          root="$RUNNER_TEMP/tos-ci-executors"
          # Authenticate the verifier BEFORE executing downloaded code. These
          # digests come from the independent producer job, never its own manifest.
          printf '%s  %s\n' "$TOS_CI_EXECUTOR_SHA256" "$root/tos-software-ci" | sha256sum --check --status
          printf '%s  %s\n' "$TOS_CI_MANIFEST_SHA256" "$root/manifest.json" | sha256sum --check --status
          chmod 0500 "$root/tos-software-ci"
          "$root/tos-software-ci" executor-bind --repo-root "$GITHUB_WORKSPACE" \
            --artifact-root "$root" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
          chmod 0500 "$root/tos-release-check" "$root/tos-validation-lanes"
      - &setup_software_node
        name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/web/package-lock.json
      - name: Install browser asset build dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --prefix access/web
      - &software_toolchain
        name: Install pinned Software Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Prepare pinned native software and browser rules
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/software-cargo-target
        run: |
          # Keep test-only features outside the production receipt stream.
          cargo build --locked -p tos-access --bin tos-e2e-fixture --features e2e-fixture --target x86_64-unknown-linux-gnu --message-format=json --timings > "$RUNNER_TEMP/software-fixture-cargo-messages.jsonl"
          trap 'cargo_status=$?; if [ "$cargo_status" -ne 0 ]; then tail -c 33554432 "$RUNNER_TEMP/software-cargo-messages.jsonl" >&2 || true; fi; exit "$cargo_status"' EXIT
          cargo build --locked -p tos-access --bin tos-access --target x86_64-unknown-linux-gnu --message-format=json --timings > "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked -p tos-command --bin tos-native-owner-command --target x86_64-unknown-linux-gnu --message-format=json --timings >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked -p tos-validation --bin tos-schema-worker --target x86_64-unknown-linux-gnu --message-format=json --timings >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked --no-default-features -p tos-ops-mechanics-plan --timings \
            --bin tos-unicode-tables --bin tos-constructor-desktop \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked --no-default-features --features mechanics -p tos-ops-mechanics-plan --timings \
            --bin tos-kag-release --bin tos-stats-release \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked -p tos-ops-mechanics-plan --timings \
            --bin tos-ops-mechanics-plan --bin tos-source-registry --bin tos-open-work-queue \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked -p tos-compiler --features source-tools --bin tos-constructor-library --bin tos-constructor-fragments --timings \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked -p tos-reader --bin tos-reader --timings \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked --no-default-features -p tos-research --features research-tools --bin tos-research --timings \
            --target x86_64-unknown-linux-gnu --message-format=json >> "$RUNNER_TEMP/software-cargo-messages.jsonl"
          cargo build --locked --release -p tos-web-rules --features wasm --target wasm32-unknown-unknown --timings
          archive="$RUNNER_TEMP/software-wasm-bindgen.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-name tos_web_rules --out-dir access/deploy/cloudflare-worker/generated \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tos_web_rules.wasm"
          # Reuse the already authenticated, same-source no-default products.
          for executor in tos-release-check tos-validation-lanes tos-software-ci; do
            cp "$RUNNER_TEMP/tos-ci-executors/$executor" "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/$executor"
          done
          rustc +1.98.1 --version > "$RUNNER_TEMP/software-rustc-version.txt"
          "$TOS_SOFTWARE_CI_EXECUTOR" software-receipts \
            --repo-root "$GITHUB_WORKSPACE" --image-root "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug" \
            --receipt-root "$RUNNER_TEMP" --executor-root "$RUNNER_TEMP/tos-ci-executors" \
            --cargo-messages "$RUNNER_TEMP/software-cargo-messages.jsonl" \
            --rustc-version "$RUNNER_TEMP/software-rustc-version.txt" --github-env "$GITHUB_ENV"
          printf '%s\n' "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug" >> "$GITHUB_PATH"
          printf 'TOS_SCHEMA_WORKER_PATH=%s\n' \
            "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-schema-worker" >> "$GITHUB_ENV"
          printf 'TOS_NATIVE_OWNER_COMMAND_PATH=%s\nTOS_NATIVE_OWNER_COMMAND_BIN=%s\n' \
            "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-native-owner-command" \
            "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-native-owner-command" >> "$GITHUB_ENV"
      - name: Check canonical definition topology and generated registry pair
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/software-cargo-target
        run: |
          cargo run --locked --no-default-features -p tos-ops-mechanics-plan --bin tos-definition-tree -- check-compatibility ToS/doctrine/semantic-interchange/definitions ToS/doctrine/semantic-interchange
      - name: Validate software contracts and build browser assets
        run: '"$TOS_RELEASE_CHECK_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --phase checks'
      - name: Admit bounded Software stage inputs
        id: stage
        run: |
          "$TOS_SOFTWARE_CI_EXECUTOR" software-stage-manifest --repo-root "$GITHUB_WORKSPACE" \
            --stage-root "$RUNNER_TEMP/software-stage" \
            --image-root "$RUNNER_TEMP/software-cargo-target/x86_64-unknown-linux-gnu/debug" \
            --receipt-root "$RUNNER_TEMP" --fixture-messages "$RUNNER_TEMP/software-fixture-cargo-messages.jsonl" \
            --rustc-version "$RUNNER_TEMP/software-rustc-version.txt" \
            --web-dist "$GITHUB_WORKSPACE/access/web/dist" \
            --worker-generated "$GITHUB_WORKSPACE/access/deploy/cloudflare-worker/generated" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve unqualified native Stage 1 inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tos-native-stage1-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/software-stage/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
      - &cargo_diagnostics
        name: Upload non-authoritative Cargo diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.job }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group || 'single' }}
          path: |
            ${{ runner.temp }}/cargo-resource-profile/sccache.json
            ${{ runner.temp }}/cargo-target/cargo-timings/
            ${{ runner.temp }}/software-cargo-target/cargo-timings/
            ${{ runner.temp }}/software-test-cargo-target/cargo-timings/
          if-no-files-found: warn
          retention-days: 14

  software:
    needs: [plan, software_prepare]
    if: ${{ needs.plan.outputs.software_mode != 'none' }}
    name: Software fixture contracts / ${{ matrix.group }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.software_mode == 'full' && '["access","query","command"]' || '["single"]') }}
    steps:
      - name: Checkout software consumer sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - *configure_software_cargo
      - *fetch_software_ci_executors
      - *bind_software_ci_executors
      - *setup_software_node
      - *software_toolchain
      - name: Configure verified Access compiler cache
        id: access_cache
        if: ${{ matrix.group == 'access' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = await import('node:fs');
            const path = await import('node:path');
            const { createHash } = await import('node:crypto');
            const { execFileSync } = await import('node:child_process');
            // This runner starts with an empty target; workspace libraries must be cacheable.
            core.exportVariable('CARGO_INCREMENTAL', '0');
            const release = 'sccache-v0.18.0-x86_64-unknown-linux-musl';
            const expectedBytes = 9730540;
            const expectedSha = '45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89';
            const tool = path.join(process.env.RUNNER_TEMP, 'access-compiler-cache');
            fs.mkdirSync(tool, { mode: 0o700 });
            const response = await fetch(`https://github.com/mozilla/sccache/releases/download/v0.18.0/${release}.tar.gz`, { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error(`Compiler cache download failed: ${response.status}`);
            const chunks = [];
            let bytes = 0;
            for await (const chunk of response.body) {
              bytes += chunk.length;
              if (bytes > expectedBytes) throw new Error('Compiler cache archive exceeds byte cap.');
              chunks.push(chunk);
            }
            const archive = Buffer.concat(chunks);
            if (bytes !== expectedBytes || createHash('sha256').update(archive).digest('hex') !== expectedSha) throw new Error('Compiler cache archive identity mismatch.');
            const archivePath = path.join(tool, 'sccache.tar.gz');
            fs.writeFileSync(archivePath, archive, { mode: 0o600 });
            execFileSync('tar', ['-xzf', archivePath, '-C', tool, '--strip-components=1', `${release}/sccache`], { timeout: 30000 });
            const binary = path.join(tool, 'sccache');
            fs.chmodSync(binary, 0o700);
            if (execFileSync(binary, ['--version'], { encoding: 'utf8', timeout: 10000 }).trim() !== 'sccache 0.18.0') throw new Error('Compiler cache version mismatch.');
            const os = fs.readFileSync('/etc/os-release', 'utf8');
            const field = name => os.split('\n').find(line => line.startsWith(`${name}=`))?.slice(name.length + 1).replace(/^"|"$/g, '');
            const platform = `${field('ID')}-${field('VERSION_ID')}-${process.arch}`;
            if (platform !== 'ubuntu-26.04-x64') throw new Error('Unqualified compiler cache platform.');
            const conf = path.join(tool, 'config.toml');
            fs.writeFileSync(conf, '', { mode: 0o600 });
            const cache = path.join(tool, 'cache');
            fs.mkdirSync(cache, { mode: 0o700 });
            const settings = {
              SCCACHE_CONF: conf,
              SCCACHE_CACHED_CONF: path.join(tool, 'cached-config'),
              SCCACHE_SERVER_UDS: path.join(tool, 'server.sock'),
              SCCACHE_DIR: cache,
              SCCACHE_CACHE_SIZE: '512M',
              SCCACHE_CLIENT_SIDE: '1',
              SCCACHE_IGNORE_SERVER_IO_ERROR: '1',
              SCCACHE_IDLE_TIMEOUT: '600',
            };
            for (const [name, value] of Object.entries(settings)) core.exportVariable(name, value);
            const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8', timeout: 10000 }).trim();
            if (!/^[0-9a-f]{40}$/.test(tree)) throw new Error('Invalid compiler-cache source tree.');
            const prefix = `tos-access-sccache-v1-0.18.0-rust1.98.1-${platform}-`;
            core.setOutput('key', `${prefix}${tree}`);
            core.setOutput('prefix', prefix);
            core.setOutput('binary', binary);
            core.setOutput('enabled', 'true');
      - name: Restore Access compiler cache archive
        id: access_cache_restore
        if: ${{ steps.access_cache.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/access-compiler-cache/cache
          key: ${{ steps.access_cache.outputs.key }}
          restore-keys: ${{ steps.access_cache.outputs.prefix }}
      - name: Start Access compiler cache
        id: access_cache_start
        if: ${{ steps.access_cache.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          CACHE_COMPILER_TOOL: ${{ steps.access_cache.outputs.binary }}
        run: |
          "$CACHE_COMPILER_TOOL" --start-server
          printf 'RUSTC_WRAPPER=%s\n' "$CACHE_COMPILER_TOOL" >> "$GITHUB_ENV"
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
      - &fetch_software_stage
        name: Fetch same-run Software stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-native-stage1-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/software-stage
      - &bind_software_stage
        name: Verify and bind exact Software stage
        run: |
          "$TOS_SOFTWARE_CI_EXECUTOR" software-stage-bind --repo-root "$GITHUB_WORKSPACE" \
            --stage-root "$RUNNER_TEMP/software-stage" \
            --manifest-sha256 "${{ needs.software_prepare.outputs.software_stage_manifest_sha256 }}" \
            --image-root "$RUNNER_TEMP/software-cargo-target/x86_64-unknown-linux-gnu/debug" \
            --receipt-root "$RUNNER_TEMP" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - &prepare_native_verity
        name: Prepare isolated fs-verity test filesystem
        run: |
          # Native immutable-file tests require a filesystem with fs-verity.
          # Format only this job-owned image; leave the runner filesystem alone.
          root="$RUNNER_TEMP/tos-verity-tests"
          mkdir -m 700 "$root"
          truncate -s 4G "$root/volume.ext4"
          mkfs.ext4 -q -F -O verity "$root/volume.ext4"
          mkdir -m 700 "$root/mounted"
          sudo mount -o loop,nodev,nosuid "$root/volume.ext4" "$root/mounted"
          sudo chown "$(id -u):$(id -g)" "$root/mounted"
          chmod 700 "$root/mounted"
          echo "TMPDIR=$root/mounted" >> "$GITHUB_ENV"
      - name: Test shared software and data-operation code on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'full' }}
        run: '"$TOS_RELEASE_CHECK_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --phase tests --test-group "${{ matrix.group }}" --command-timeout-ms 900000 --cargo-timings'
      - name: Test reader and API behavior on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'reader' }}
        run: '"$TOS_VALIDATION_LANES_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --run software_reader --cargo-timings'
      - name: Capture Access compiler cache diagnostics
        if: ${{ always() && steps.access_cache_start.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          umask 077
          trap '"$RUSTC_WRAPPER" --stop-server' EXIT
          mkdir -p "$RUNNER_TEMP/cargo-resource-profile"
          "$RUSTC_WRAPPER" --show-stats --stats-format=json > "$RUNNER_TEMP/cargo-resource-profile/sccache.json"
      - name: Save Access compiler cache archive
        if: ${{ success() && steps.access_cache_start.outputs.enabled == 'true' && github.event_name != 'pull_request' && steps.access_cache_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/access-compiler-cache/cache
          key: ${{ steps.access_cache.outputs.key }}
      - *cargo_diagnostics
      - &cleanup_native_verity
        name: Unmount isolated fs-verity test filesystem
        if: ${{ always() }}
        run: |
          root="$RUNNER_TEMP/tos-verity-tests"
          if mountpoint -q "$root/mounted"; then
            sudo umount "$root/mounted" || sudo umount --lazy "$root/mounted"
          fi

  software_package:
    needs: [plan, software_prepare]
    if: ${{ needs.plan.outputs.software_mode != 'none' }}
    name: Software package and installed browser
    runs-on: ubuntu-26.04
    outputs:
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
      candidate_sidecar_sha256: ${{ steps.candidate.outputs.candidate_sidecar_sha256 }}
      candidate_bytes: ${{ steps.candidate.outputs.candidate_bytes }}
      candidate_sidecar_bytes: ${{ steps.candidate.outputs.candidate_sidecar_bytes }}
    steps:
      - name: Checkout software consumer sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - *configure_software_cargo
      - *fetch_software_ci_executors
      - *bind_software_ci_executors
      - *setup_software_node
      - *software_toolchain
      - *fetch_software_stage
      - *bind_software_stage
      - name: Install software test dependencies
        run: |
          # Keep signed Ubuntu packages; avoid the measured slow Azure HTTP mirror.
          sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' /etc/apt/apt-mirrors.txt
          npm ci --prefer-offline --no-audit --no-fund --prefix access/web
          npm install --prefix "$RUNNER_TEMP/tos-e2e-deps" --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/tos-e2e-deps/node_modules/.bin/playwright" install --with-deps chromium
          echo "TOS_E2E_NODE_MODULES=$RUNNER_TEMP/tos-e2e-deps/node_modules" >> "$GITHUB_ENV"
      - *prepare_native_verity
      - name: Build and install the native software artifact without corpus data
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/software-cargo-target
        run: |
          native="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-access"
          root="$GITHUB_WORKSPACE"
          archive="$root/dist/tree-of-sophia-software.zip"
          # Bound every selected native image plus generated manifest/README.
          "$TOS_SOFTWARE_CI_EXECUTOR" software-limits --repo-root "$root" \
            --image-root "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug" --receipt-root "$RUNNER_TEMP"
          read -r total_cap archive_cap member_cap metadata_cap < "$RUNNER_TEMP/tos-native-package-limits.txt"
          limits=(--max-total-bytes "$total_cap" --max-archive-bytes "$archive_cap" --max-members "$member_cap" --max-metadata-bytes "$metadata_cap")
          mkdir -p -- "$root/dist"
          "$native" software build --root "$root" --source-ref "${{ github.sha }}" \
            --web-dist "$root/access/web/dist" --output "$archive" \
            --native-access-binary "$native" --native-access-receipt "$RUNNER_TEMP/tos-native-build.json" \
            --native-command-products "$RUNNER_TEMP/tos-native-command-products.json" "${limits[@]}"
          repeated="$RUNNER_TEMP/tree-of-sophia-software-repeat.zip"
          "$native" software build --root "$root" --source-ref "${{ github.sha }}" \
            --web-dist "$root/access/web/dist" --output "$repeated" \
            --native-access-binary "$native" --native-access-receipt "$RUNNER_TEMP/tos-native-build.json" \
            --native-command-products "$RUNNER_TEMP/tos-native-command-products.json" "${limits[@]}"
          if ! cmp --silent "$archive" "$repeated"; then
            echo 'native software archive is not byte deterministic' >&2
            exit 1
          fi
          if ! cmp --silent "$archive.manifest.json" "$repeated.manifest.json"; then
            echo 'native software sidecar is not byte deterministic' >&2
            exit 1
          fi
          "$native" software verify --archive "$archive" "${limits[@]}"
          env -u TOS_DEPLOYMENT_PROFILE "$native" software install --archive "$archive" --prefix "$RUNNER_TEMP/tos-native-install"
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos" --help
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos" --version
          for role in tos-native-owner-command tos-schema-worker tos-validation-lanes tos-release-check tos-software-ci tos-ops-mechanics-plan tos-constructor-library tos-constructor-fragments tos-reader tos-kag-release tos-stats-release tos-unicode-tables tos-constructor-desktop tos-source-registry tos-open-work-queue tos-research; do
            test -x "$RUNNER_TEMP/tos-native-install/bin/$role"
          done
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos-research" --help
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos-research" foundation --help
          printf 'TOS_RESEARCH_EXECUTOR=%s\n' "$RUNNER_TEMP/tos-native-install/bin/tos-research" >> "$GITHUB_ENV"
          printf 'TOS_E2E_FIXTURE_BIN=%s\n' "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-e2e-fixture" >> "$GITHUB_ENV"
          printf 'TOS_E2E_SITE_EXECUTABLE=%s\n' "$RUNNER_TEMP/tos-native-install/software/access/src/tos_access/tos-access" >> "$GITHUB_ENV"
      - name: Test browser behavior with bounded native fixtures
        # The harness bounds fresh native host/browser pairs to two, then runs
        # shared-cache Vite scenarios serially. Keep every original case and
        # the complete cohort's existing slow-renderer timeout envelope.
        run: '"$TOS_VALIDATION_LANES_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --run software_browser --command-timeout-ms 900000'
      - name: Bind unqualified candidate digests
        id: candidate
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          for (const [key, file] of [['candidate', 'dist/tree-of-sophia-software.zip'], ['candidate_sidecar', 'dist/tree-of-sophia-software.zip.manifest.json']]) {
            const hash = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}_sha256=${hash.digest('hex')}\n${key}_bytes=${fs.statSync(file).size}\n`);
          }
          JS
      - name: Preserve unqualified Software candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tos-software-candidate-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/tree-of-sophia-software.zip
            dist/tree-of-sophia-software.zip.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - *cargo_diagnostics
      - *cleanup_native_verity

  worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker == 'true' }}
    name: Worker Software Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worker software
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Identify Cargo cache platform
        id: cargo_platform
        run: |
          . /etc/os-release
          printf 'image=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf 'CARGO_HOME=%s/worker-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/worker-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore optional Worker Cargo libraries
        id: cargo_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/worker-cargo-home/registry
            ${{ runner.temp }}/worker-cargo-target/**/.fingerprint
            ${{ runner.temp }}/worker-cargo-target/**/build
            ${{ runner.temp }}/worker-cargo-target/**/deps/*.rlib
            ${{ runner.temp }}/worker-cargo-target/**/deps/*.rmeta
            ${{ runner.temp }}/worker-cargo-target/**/deps/*.so
            ${{ runner.temp }}/worker-cargo-target/**/deps/*.d
          key: tos-cargo-lib-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo_platform.outputs.image }}-rust1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/crates/**/Cargo.toml', 'tests/conformance/rust/Cargo.toml') }}-worker-native-wasm-release-debug0-${{ steps.cargo_platform.outputs.source_tree }}
          restore-keys: |
            tos-cargo-lib-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo_platform.outputs.image }}-rust1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/crates/**/Cargo.toml', 'tests/conformance/rust/Cargo.toml') }}-worker-native-wasm-release-debug0-
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: access/deploy/cloudflare-worker/package-lock.json

      - name: Prepare pinned Worker rules
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.98.1 build --locked --release -p tos-web-rules --features wasm --target wasm32-unknown-unknown
          archive="$RUNNER_TEMP/worker-wasm-bindgen.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-name tos_web_rules --out-dir access/deploy/cloudflare-worker/generated \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tos_web_rules.wasm"

      - name: Test Worker contracts without deployment or production data
        run: |
          npm ci --prefer-offline --no-audit --no-fund --prefix access/deploy/cloudflare-worker
          npm run typecheck --prefix access/deploy/cloudflare-worker
          npm test --prefix access/deploy/cloudflare-worker

  rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: Rust / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [conformance, workspace, cold-install]
    # Native exec fixtures run host ELF programs through sealed memfds.
    # Keep their qualified platform stable across ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Rust sources and validation route
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Configure Cargo paths
        run: |
          printf 'CARGO_HOME=%s/cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - name: Verify and bind exact native CI executors
        env:
          TOS_CI_EXECUTOR_SHA256: ${{ needs.plan.outputs.executor_sha256 }}
          TOS_CI_MANIFEST_SHA256: ${{ needs.plan.outputs.executor_manifest_sha256 }}
        run: |
          root="$RUNNER_TEMP/tos-ci-executors"
          # Authenticate the verifier BEFORE executing downloaded code. These
          # digests come from the independent producer job, never its own manifest.
          printf '%s  %s\n' "$TOS_CI_EXECUTOR_SHA256" "$root/tos-software-ci" | sha256sum --check --status
          printf '%s  %s\n' "$TOS_CI_MANIFEST_SHA256" "$root/manifest.json" | sha256sum --check --status
          chmod 0500 "$root/tos-software-ci"
          "$root/tos-software-ci" executor-bind --repo-root "$GITHUB_WORKSPACE" \
            --artifact-root "$root" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
          chmod 0500 "$root/tos-release-check" "$root/tos-validation-lanes"
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Setup Node for generated WebAssembly host
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Prepare retained source-cut fixture
        run: |
          source_ref="$(cat tests/conformance/rust/retained-opening-source.txt)"
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 --filter=blob:none origin "$source_ref"
          SOURCE_REF="$source_ref" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const planPath = 'ToS/source-witnesses/works/friedrich-nietzsche/also-sprach-zarathustra/gold-sets/foundation-pilot-v1/za-i-vorrede-1-opening-sentence-alignment.plan.v1.json';
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const paths = [planPath,
            ...['source_sentence_packet_ref', 'target_sentence_packet_ref', 'alignment_packet_ref', 'provenance_event_ref'].map(key => plan.outputs[key]),
            ...['text_layer_ref', 'layout_packet_ref', 'edition_reading_admission_ref', 'rights_ref'].map(key => plan.source[key]),
            ...['text_layer_ref', 'layout_packet_ref', 'expression_record_ref', 'responsibility_claims_ref', 'rights_ref'].map(key => plan.target[key])];
          assert.equal(new Set(paths).size, 14);
          for (const path of paths) {
            assert.equal(typeof path, 'string');
            assert(path.startsWith('ToS/source-witnesses/') && !path.split('/').includes('..'));
            // Fetch only the selected historical blobs before the native
            // capture deliberately disables network and lazy object fetching.
            execFileSync('git', ['show', `${process.env.SOURCE_REF}:${path}`], { maxBuffer: 2 * 1024 * 1024, timeout: 30_000 });
          }
          console.log('Prepared 14 exact historical source members; native capture verifies their bytes.');
          JS
      - name: Install verified wasm-bindgen CLI
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - *prepare_native_verity
      - name: Verify Rust workspace, conformance products and isolated install
        env:
          TOS_NATIVE_OWNER_COMMAND_PATH: ${{ runner.temp }}/cargo-target/debug/tos-native-owner-command
          TOS_NATIVE_OWNER_COMMAND_BIN: ${{ runner.temp }}/cargo-target/debug/tos-native-owner-command
          TOS_NATIVE_PREPARED_CONSUMER_BIN: ${{ runner.temp }}/cargo-target/debug/tos-access
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
        run: '"$TOS_VALIDATION_LANES_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --run rust_workspace --rust-group "${{ matrix.group }}" --growth-jobs "$TOS_GROWTH_JOBS" --lane-timeout-ms 10800000 --cargo-timings'
      - *cargo_diagnostics

      - *cleanup_native_verity

  postgres:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: PostgreSQL Durable Command Laboratory
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
    services:
      postgres:
        # Docker Official Image, pinned to the verified upstream OCI index digest.
        image: docker.io/library/postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: tos_cmd_lab
          POSTGRES_USER: tos_cmd_lab
          POSTGRES_PASSWORD: synthetic_lab_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tos_cmd_lab -d tos_cmd_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout bounded Rust and PostgreSQL fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Configure Cargo paths
        run: |
          printf 'CARGO_HOME=%s/cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build exact native schema worker
        run: cargo build --locked -p tos-validation --bin tos-schema-worker
      - *prepare_native_verity
      - name: Verify durable command transactions against PostgreSQL
        env:
          # Apply the native fixture process contract to test executables only.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "prlimit --as=1073741824:1073741824 --fsize=67108864:67108864 --"
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
          TOS_CMD_POSTGRES_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_lab
          TOS_CMD2_V2_RESTORE_DATABASE: tos_cmd_restore_current_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE: tos_cmd_restore_v1_wire_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_RESTORE_PG_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_restore_current_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_restore_v1_wire_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          : "${TOS_CMD_POSTGRES_URL:?dedicated PostgreSQL connection is required}"
          : "${TOS_CMD2_V2_RESTORE_PG_URL:?fresh current-writer restore database is required}"
          : "${TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL:?fresh V1-wire restore database is required}"
          test "${TOS_CMD2_V2_RESTORE_PG_URL##*/}" = "$TOS_CMD2_V2_RESTORE_DATABASE"
          test "${TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL##*/}" = "$TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          export TOS_CMD2_PG_DUMP_PATH=/usr/lib/postgresql/16/bin/pg_dump
          export TOS_CMD2_PG_RESTORE_PATH=/usr/lib/postgresql/16/bin/pg_restore
          "$TOS_CMD2_PG_DUMP_PATH" --version | grep -Eq ' \(PostgreSQL\) 16\.'
          "$TOS_CMD2_PG_RESTORE_PATH" --version | grep -Eq ' \(PostgreSQL\) 16\.'
          psql "$TOS_CMD_POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$TOS_CMD2_V2_RESTORE_DATABASE\"" \
            -c "CREATE DATABASE \"$TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE\""
          export TOS_CMD2_PG_DUMP_SHA256="$(sha256sum "$TOS_CMD2_PG_DUMP_PATH" | cut -d ' ' -f 1)"
          export TOS_CMD2_PG_RESTORE_SHA256="$(sha256sum "$TOS_CMD2_PG_RESTORE_PATH" | cut -d ' ' -f 1)"
          cargo test -p tos-command --features postgres-lab --test postgres_durable_lab --locked -- --nocapture --test-threads=1
          # Run the maintained opt-in regressions on this already isolated PG
          # service after the durable integration suite has finished.
          cargo test -p tos-command --features postgres-lab --lib --locked \
            durable_adapter::durable_projection::durable_navigation_event::bounded_batch_pg_tests \
            -- --ignored --nocapture --test-threads=1
          TOS_METADATA_TEST_PG_URL="$TOS_CMD_POSTGRES_URL" \
            cargo test -p tos-command --features postgres-lab --lib --locked \
            backup_recovery::tests::backup_cut_streams_large_metadata_and_keeps_selected_bounds \
            -- --exact --ignored --nocapture --test-threads=1
          for metadata_test in \
            durable_adapter::source_cohort::source_cohort_streamed::owner_metadata_budget_tests::postgres_contract_owner_metadata_logical_fields \
            durable_adapter::source_cohort::publication_import_reassessment_tests::postgres_contract_publication_reassessment_keeps_import_head; do
            TOS_METADATA_TEST_PG_URL="$TOS_CMD_POSTGRES_URL" \
              cargo test -p tos-command --features postgres-lab --lib --locked \
              "$metadata_test" -- --exact --ignored --nocapture --test-threads=1 \
              | tee "$RUNNER_TEMP/tos-pg-owner-metadata.log"
            grep -Fq "test $metadata_test ... ok" "$RUNNER_TEMP/tos-pg-owner-metadata.log"
          done

      - *cleanup_native_verity

  required_gate:
    name: Repo Validation
    if: ${{ always() }}
    needs: [plan, software_prepare, software, software_package, worker, rust, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - name: Verify and bind exact native CI executors
        env:
          TOS_CI_EXECUTOR_SHA256: ${{ needs.plan.outputs.executor_sha256 }}
          TOS_CI_MANIFEST_SHA256: ${{ needs.plan.outputs.executor_manifest_sha256 }}
        run: |
          root="$RUNNER_TEMP/tos-ci-executors"
          # Authenticate the verifier BEFORE executing downloaded code. These
          # digests come from the independent producer job, never its own manifest.
          printf '%s  %s\n' "$TOS_CI_EXECUTOR_SHA256" "$root/tos-software-ci" | sha256sum --check --status
          printf '%s  %s\n' "$TOS_CI_MANIFEST_SHA256" "$root/manifest.json" | sha256sum --check --status
          chmod 0500 "$root/tos-software-ci"
          "$root/tos-software-ci" executor-bind --repo-root "$GITHUB_WORKSPACE" \
            --artifact-root "$root" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
          chmod 0500 "$root/tos-release-check" "$root/tos-validation-lanes"
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: '"$TOS_SOFTWARE_CI_EXECUTOR" gate'
      - name: Fetch candidate after every selected check
        if: ${{ success() && needs.plan.outputs.software_mode != 'none' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-software-candidate-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-software-candidate
      - name: Verify candidate against package job outputs
        if: ${{ success() && needs.plan.outputs.software_mode != 'none' }}
        env:
          CANDIDATE_SHA256: ${{ needs.software_package.outputs.candidate_sha256 }}
          CANDIDATE_SIDECAR_SHA256: ${{ needs.software_package.outputs.candidate_sidecar_sha256 }}
          CANDIDATE_BYTES: ${{ needs.software_package.outputs.candidate_bytes }}
          CANDIDATE_SIDECAR_BYTES: ${{ needs.software_package.outputs.candidate_sidecar_bytes }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const root = path.join(process.env.RUNNER_TEMP, 'qualified-software-candidate');
          const files = [['tree-of-sophia-software.zip', 'CANDIDATE'], ['tree-of-sophia-software.zip.manifest.json', 'CANDIDATE_SIDECAR']];
          assert.deepEqual(fs.readdirSync(root).sort(), files.map(([name]) => name).sort());
          for (const [name, prefix] of files) {
            const expected = process.env[`${prefix}_SHA256`], bytes = process.env[`${prefix}_BYTES`];
            assert.match(expected, /^[a-f0-9]{64}$/); assert.match(bytes, /^[1-9][0-9]*$/);
            const file = path.join(root, name), stat = fs.lstatSync(file);
            assert(stat.isFile() && !stat.isSymbolicLink()); assert.equal(stat.size, Number(bytes));
            const hash = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
            assert.equal(hash.digest('hex'), expected, `${name} differs from the admitted package job`);
          }
          JS
      - name: Preserve validated software candidate
        if: ${{ success() && needs.plan.outputs.software_mode != 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-of-sophia-software-${{ github.sha }}
          path: ${{ runner.temp }}/qualified-software-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
