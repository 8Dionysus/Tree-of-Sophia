name: Repo Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks and validate changed documentation
    runs-on: ubuntu-latest
    outputs:
      software_mode: ${{ steps.select.outputs.software_mode }}
      worker: ${{ steps.select.outputs.worker }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Select checks from both sides of the exact change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL_RELEASE" = true ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python scripts/software_ci.py plan --base HEAD --full
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python scripts/software_ci.py plan --base "$BASE_SHA"
          fi

  software:
    needs: plan
    if: ${{ needs.plan.outputs.software_mode != 'none' }}
    name: Software Contracts, Browser and Installed Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout software and bounded test fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # Select complete implementation modules, not their current import graph.
        # Corpus inputs remain limited to contracts and named synthetic fixtures.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /access/
            !/access/web/dist/
            /scripts/
            /mechanics/growth-cycle/parts/branch-growth-cycle/scripts/
            /mechanics/growth-cycle/tests/test_source_revisions.py
            /docs/validation/validation_lanes.json
            /rust/README.md
            /tests/test_validation_lanes.py
            /tests/test_file_membership.py
            /tests/test_software_ci.py
            /tests/test_corpus_*.py
            /tests/test_local_stats_port.py
            /tests/test_build_kag_export.py
            /tests/test_downstream_status.py
            /tests/test_publish_kag_release.py
            /tests/test_publish_stats_release.py
            /kag/provider-template.json
            /mechanics/boundary-bridge/parts/derived-kag-seam/scripts/generate_kag_export.py
            /tests/test_source_catalog_projection.py
            /tests/test_source_catalog_slots.py
            /tests/test_native_text_binding.py
            /ToS/contracts/
            /ToS/source-witnesses/works/friedrich-nietzsche/jenseits-von-gut-und-boese/expressions/de-naumann-1886/editions/leipzig-c-g-naumann-1886/items/internet-archive-google-harvard-scan-pdf/item.manifest.json
            /ToS/source-witnesses/works/friedrich-nietzsche/jenseits-von-gut-und-boese/expressions/de-naumann-1886/editions/leipzig-c-g-naumann-1886/items/internet-archive-google-harvard-scan-pdf/rights.json
            /ToS/canon/registries/predicates.csv
            /ToS/doctrine/semantic-interchange/entity-types.v1.json
            /ToS/doctrine/semantic-interchange/relation-types.v1.json
            /tests/fixtures/native-text-binding/
            /requirements-dev.txt
            /pytest.ini
            /.github/workflows/repo-validation.yml

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/web/package-lock.json

      - name: Install software test dependencies
        run: |
          python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2' 'playwright>=1.40'
          npm ci --prefer-offline --no-audit --no-fund --prefix access/web
          python -m playwright install --with-deps chromium

      - name: Validate software contracts and build browser assets
        run: python scripts/release_check.py --phase checks

      - name: Test shared software and data-operation code on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'full' }}
        run: python scripts/release_check.py --phase tests

      - name: Test reader and API behavior on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'reader' }}
        run: python scripts/validation_lanes.py --run software_reader

      - name: Test browser behavior with bounded fixtures
        run: python scripts/validation_lanes.py --run software_browser

      - name: Build and install the software artifact without corpus data
        run: |
          python access/packaging/build_software_bundle.py \
            --output dist/tree-of-sophia-software.zip \
            --source-ref "${{ github.sha }}"
          python access/packaging/validate_software_bundle.py --bundle dist/tree-of-sophia-software.zip

      - name: Preserve validated software candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-of-sophia-software-${{ github.sha }}
          path: |
            dist/tree-of-sophia-software.zip
            dist/tree-of-sophia-software.zip.manifest.json
          if-no-files-found: error
          retention-days: 14

  worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker == 'true' }}
    name: Worker Software Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worker software
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # Keep the same owner implementation boundary as the Python software job.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /access/
            !/access/web/dist/
            /scripts/
            /mechanics/growth-cycle/parts/branch-growth-cycle/scripts/
            /mechanics/growth-cycle/tests/test_identity_proposals.py
            /mechanics/growth-cycle/tests/test_source_claim_commands.py
            /mechanics/growth-cycle/tests/test_source_commands.py
            /ToS/contracts/
            /ToS/canon/registries/predicates.csv
            /ToS/doctrine/semantic-interchange/entity-types.v1.json
            /ToS/doctrine/semantic-interchange/relation-types.v1.json
            /requirements-dev.txt

      - name: Setup Python for cross-adapter fixture checks
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          # Worker native-string ABI uses the CPython Unicode 16 tables.
          python-version: "3.14"

      - name: Install cross-adapter test dependencies
        run: python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/deploy/cloudflare-worker/package-lock.json

      - name: Test Worker contracts without deployment or production data
        run: |
          npm ci --prefer-offline --no-audit --no-fund --prefix access/deploy/cloudflare-worker
          npm run typecheck --prefix access/deploy/cloudflare-worker
          npm test --prefix access/deploy/cloudflare-worker

  rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: Rust Workspace and Installed Probe
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo-home
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout Rust sources and validation route
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /rust-toolchain.toml
            /rust/
            /tests/conformance/rust/
            /scripts/validation_lanes.py
            /scripts/verify_rust_reader_install.py
            /docs/validation/validation_lanes.json
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Verify Rust workspace and isolated install
        run: python scripts/validation_lanes.py --run rust_workspace

  required_gate:
    name: Repo Validation
    if: ${{ always() }}
    needs: [plan, software, worker, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: scripts
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/software_ci.py gate
