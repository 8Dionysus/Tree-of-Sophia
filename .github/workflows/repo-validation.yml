name: Repo Validation

on:
  push:
    branches:
      - main
  # Keep the required repository gate explicit for pull-request events.
  pull_request:

concurrency:
  group: repo-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kag_owner_family:
    name: KAG Owner Family
    runs-on: ubuntu-latest
    env:
      AOA_KAG_REVISION: b95446483f25e1f59c732f5c095d4f641a1c9431
      AOA_KAG_ROOT: ${{ runner.temp }}/aoa-kag
      # The pinned composite action executes provider scripts by absolute path;
      # expose the matching checkout so segmented-family imports cannot resolve
      # accidentally against the consumer repository's ``scripts`` package.
      PYTHONPATH: ${{ runner.temp }}/aoa-kag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Fetch pinned aoa-kag provider imports
        run: |
          git init --quiet "$AOA_KAG_ROOT"
          git -C "$AOA_KAG_ROOT" fetch --quiet --no-tags --depth=1 https://github.com/8Dionysus/aoa-kag.git "$AOA_KAG_REVISION"
          git -C "$AOA_KAG_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$AOA_KAG_ROOT" rev-parse HEAD)" = "$AOA_KAG_REVISION"

      - name: Check current canonical KAG owner family
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@b95446483f25e1f59c732f5c095d4f641a1c9431
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

  release_audit:
    name: Release Audit
    runs-on: ubuntu-latest
    env:
      AOA_STATS_REVISION: 88ff38b1b38eef939f2c5b4541cbe8363a05fc8d
      AOA_KAG_REVISION: b95446483f25e1f59c732f5c095d4f641a1c9431
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Budget receipts bind admission to an exact historical base_ref.
          # Keep that owner evidence locally verifiable for the release lane.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validator and standalone MCP dependencies
        run: python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2'

      - name: Fetch pinned aoa-stats contract owner
        env:
          AOA_STATS_ROOT: ${{ runner.temp }}/aoa-stats
        run: |
          git init --quiet "$AOA_STATS_ROOT"
          git -C "$AOA_STATS_ROOT" fetch --quiet --no-tags --depth=1 https://github.com/8Dionysus/aoa-stats.git "$AOA_STATS_REVISION"
          git -C "$AOA_STATS_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$AOA_STATS_ROOT" rev-parse HEAD)" = "$AOA_STATS_REVISION"

      - name: Fetch pinned aoa-kag provider owner
        env:
          AOA_KAG_ROOT: ${{ runner.temp }}/aoa-kag
        run: |
          git init --quiet "$AOA_KAG_ROOT"
          git -C "$AOA_KAG_ROOT" fetch --quiet --no-tags --depth=1 https://github.com/8Dionysus/aoa-kag.git "$AOA_KAG_REVISION"
          git -C "$AOA_KAG_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$AOA_KAG_ROOT" rev-parse HEAD)" = "$AOA_KAG_REVISION"

      - name: Run release audit
        env:
          AOA_STATS_ROOT: ${{ runner.temp }}/aoa-stats
          AOA_KAG_ROOT: ${{ runner.temp }}/aoa-kag
          AOA_KAG_REVISION: ${{ env.AOA_KAG_REVISION }}
          # Exact event baseline only. Missing/zero/non-commit inputs fail closed;
          # the owner gate never chooses HEAD^, a branch, or a remote fallback.
          TOS_SEMANTIC_REGISTRY_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Permit a first introduction only when all four baseline objects
          # and any earlier declared-profile reader are genuinely absent.
          TOS_SEMANTIC_REGISTRY_ALLOW_INITIAL_INTRODUCTION: "1"
        run: python scripts/release_check.py --phase checks

  repository_tests:
    name: Repository Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2'

      - name: Run repository tests
        run: python scripts/release_check.py --phase tests

  product_shell:
    name: Product Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: python -m pip install -r requirements-dev.txt 'playwright>=1.40'

      - name: Setup Node for the WebMCP browser contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/web/package-lock.json

      - name: Validate the WebMCP browser contract and checked-in build
        run: |
          npm ci --prefer-offline --no-audit --no-fund --prefix access/web
          npm run test --prefix access/web
          npm run typecheck --prefix access/web
          npm run build --prefix access/web
          git diff --exit-code -- access/web/dist

      - name: Validate the Product Shell in Chromium
        run: |
          python -m playwright install --with-deps chromium
          PYTHONPATH=access/src pytest -q access/tests/test_http_security.py access/e2e/test_webmcp.py

  standalone_product_candidate:
    name: Standalone Product Candidate
    needs:
      - release_audit
      - repository_tests
      - product_shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Build and validate standalone product candidate
        run: |
          mkdir -p dist
          python access/packaging/build_standalone_bundle.py --output dist/tree-of-sophia-standalone.zip
          python access/packaging/validate_standalone.py --bundle dist/tree-of-sophia-standalone.zip

      - name: Publish standalone product candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-of-sophia-standalone-${{ github.sha }}
          path: |
            dist/tree-of-sophia-standalone.zip
            dist/tree-of-sophia-standalone.zip.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  required_gate:
    name: Repo Validation
    if: ${{ always() }}
    needs:
      - kag_owner_family
      - release_audit
      - repository_tests
      - product_shell
      - standalone_product_candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation branch to pass
        run: |
          test "${{ needs.kag_owner_family.result }}" = "success"
          test "${{ needs.release_audit.result }}" = "success"
          test "${{ needs.repository_tests.result }}" = "success"
          test "${{ needs.product_shell.result }}" = "success"
          test "${{ needs.standalone_product_candidate.result }}" = "success"
