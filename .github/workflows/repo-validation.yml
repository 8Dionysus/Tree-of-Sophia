      - name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - name: Verify and bind exact native CI executors
        env:
          TOS_CI_EXECUTOR_SHA256: ${{ needs.plan.outputs.executor_sha256 }}
          TOS_CI_MANIFEST_SHA256: ${{ needs.plan.outputs.executor_manifest_sha256 }}
        run: |
          root="$RUNNER_TEMP/tos-ci-executors"
          # Authenticate the verifier BEFORE executing downloaded code. These
          # digests come from the independent producer job, never its own manifest.
          printf '%s  %s\n' "$TOS_CI_EXECUTOR_SHA256" "$root/tos-software-ci" | sha256sum --check --status
          printf '%s  %s\n' "$TOS_CI_MANIFEST_SHA256" "$root/manifest.json" | sha256sum --check --status
          chmod 0500 "$root/tos-software-ci"
          "$root/tos-software-ci" executor-bind --repo-root "$GITHUB_WORKSPACE" \
            --artifact-root "$root" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
          chmod 0500 "$root/tos-release-check" "$root/tos-validation-lanes"
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Setup Node for generated WebAssembly host
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - *cargo_resource_profile
      - name: Prepare retained source-cut fixture
        run: |
          source_ref="$(cat tests/conformance/rust/retained-opening-source.txt)"
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 --filter=blob:none origin "$source_ref"
          SOURCE_REF="$source_ref" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const planPath = 'ToS/source-witnesses/works/friedrich-nietzsche/also-sprach-zarathustra/gold-sets/foundation-pilot-v1/za-i-vorrede-1-opening-sentence-alignment.plan.v1.json';
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const paths = [planPath,
            ...['source_sentence_packet_ref', 'target_sentence_packet_ref', 'alignment_packet_ref', 'provenance_event_ref'].map(key => plan.outputs[key]),
            ...['text_layer_ref', 'layout_packet_ref', 'edition_reading_admission_ref', 'rights_ref'].map(key => plan.source[key]),
            ...['text_layer_ref', 'layout_packet_ref', 'expression_record_ref', 'responsibility_claims_ref', 'rights_ref'].map(key => plan.target[key])];
          assert.equal(new Set(paths).size, 14);
          for (const path of paths) {
            assert.equal(typeof path, 'string');
            assert(path.startsWith('ToS/source-witnesses/') && !path.split('/').includes('..'));
            // Fetch only the selected historical blobs before the native
            // capture deliberately disables network and lazy object fetching.
            execFileSync('git', ['show', `${process.env.SOURCE_REF}:${path}`], { maxBuffer: 2 * 1024 * 1024, timeout: 30_000 });
          }
          console.log('Prepared 14 exact historical source members; native capture verifies their bytes.');
          JS
      - name: Install verified wasm-bindgen CLI
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - *prepare_native_verity
      - *cargo_resource_before
      - name: Verify Rust workspace, conformance products and isolated install
        env:
          TOS_NATIVE_OWNER_COMMAND_PATH: ${{ runner.temp }}/cargo-target/debug/tos-native-owner-command
          TOS_NATIVE_OWNER_COMMAND_BIN: ${{ runner.temp }}/cargo-target/debug/tos-native-owner-command
          TOS_NATIVE_PREPARED_CONSUMER_BIN: ${{ runner.temp }}/cargo-target/debug/tos-access
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
        run: '"$TOS_VALIDATION_LANES_EXECUTOR" --repo-root "$GITHUB_WORKSPACE" --run rust_workspace --rust-group "${{ matrix.group }}" --growth-jobs 2 --lane-timeout-ms 10800000 --cargo-timings'
      - *cargo_resource_after
      - *cargo_diagnostics

      - *cleanup_native_verity

  postgres:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: PostgreSQL Durable Command Laboratory
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
    services:
      postgres:
        # Docker Official Image, pinned to the verified upstream OCI index digest.
        image: docker.io/library/postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: tos_cmd_lab
          POSTGRES_USER: tos_cmd_lab
          POSTGRES_PASSWORD: synthetic_lab_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tos_cmd_lab -d tos_cmd_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout bounded Rust and PostgreSQL fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: *rust_fixture_checkout
      - name: Configure Cargo paths
        run: |
          printf 'CARGO_HOME=%s/cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build exact native schema worker
        run: cargo build --locked -p tos-validation --bin tos-schema-worker
      - *prepare_native_verity
      - name: Verify durable command transactions against PostgreSQL
        env:
          # Apply the native fixture process contract to test executables only.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "prlimit --as=1073741824:1073741824 --fsize=67108864:67108864 --"
          TOS_SCHEMA_WORKER_PATH: ${{ runner.temp }}/cargo-target/debug/tos-schema-worker
          TOS_CMD_POSTGRES_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_lab
          TOS_CMD2_V2_RESTORE_DATABASE: tos_cmd_restore_current_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE: tos_cmd_restore_v1_wire_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_RESTORE_PG_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_restore_current_${{ github.run_id }}_${{ github.run_attempt }}
          TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_restore_v1_wire_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          : "${TOS_CMD_POSTGRES_URL:?dedicated PostgreSQL connection is required}"
          : "${TOS_CMD2_V2_RESTORE_PG_URL:?fresh current-writer restore database is required}"
          : "${TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL:?fresh V1-wire restore database is required}"
          test "${TOS_CMD2_V2_RESTORE_PG_URL##*/}" = "$TOS_CMD2_V2_RESTORE_DATABASE"
          test "${TOS_CMD2_V2_V1_WIRE_RESTORE_PG_URL##*/}" = "$TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          export TOS_CMD2_PG_DUMP_PATH=/usr/lib/postgresql/16/bin/pg_dump
          export TOS_CMD2_PG_RESTORE_PATH=/usr/lib/postgresql/16/bin/pg_restore
          "$TOS_CMD2_PG_DUMP_PATH" --version | grep -Eq ' \(PostgreSQL\) 16\.'
          "$TOS_CMD2_PG_RESTORE_PATH" --version | grep -Eq ' \(PostgreSQL\) 16\.'
          psql "$TOS_CMD_POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$TOS_CMD2_V2_RESTORE_DATABASE\"" \
            -c "CREATE DATABASE \"$TOS_CMD2_V2_V1_WIRE_RESTORE_DATABASE\""
          export TOS_CMD2_PG_DUMP_SHA256="$(sha256sum "$TOS_CMD2_PG_DUMP_PATH" | cut -d ' ' -f 1)"
          export TOS_CMD2_PG_RESTORE_SHA256="$(sha256sum "$TOS_CMD2_PG_RESTORE_PATH" | cut -d ' ' -f 1)"
          cargo test -p tos-command --features postgres-lab --test postgres_durable_lab --locked -- --nocapture --test-threads=1
          # Run the maintained opt-in regressions on this already isolated PG
          # service after the durable integration suite has finished.
          cargo test -p tos-command --features postgres-lab --lib --locked \
            durable_adapter::durable_projection::durable_navigation_event::bounded_batch_pg_tests \
            -- --ignored --nocapture --test-threads=1
          TOS_METADATA_TEST_PG_URL="$TOS_CMD_POSTGRES_URL" \
            cargo test -p tos-command --features postgres-lab --lib --locked \
            backup_recovery::tests::backup_cut_streams_large_metadata_and_keeps_selected_bounds \
            -- --exact --ignored --nocapture --test-threads=1
          for metadata_test in \
            durable_adapter::source_cohort::source_cohort_streamed::owner_metadata_budget_tests::postgres_contract_owner_metadata_logical_fields \
            durable_adapter::source_cohort::publication_import_reassessment_tests::postgres_contract_publication_reassessment_keeps_import_head; do
            TOS_METADATA_TEST_PG_URL="$TOS_CMD_POSTGRES_URL" \
              cargo test -p tos-command --features postgres-lab --lib --locked \
              "$metadata_test" -- --exact --ignored --nocapture --test-threads=1 \
              | tee "$RUNNER_TEMP/tos-pg-owner-metadata.log"
            grep -Fq "test $metadata_test ... ok" "$RUNNER_TEMP/tos-pg-owner-metadata.log"
          done

      - *cleanup_native_verity


  required_gate:
    name: Repo Validation
    if: ${{ always() }}
    needs: [plan, software_prepare, software, software_package, worker, rust, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /Cargo.lock
      - name: Fetch same-run native CI executors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-ci-executors-${{ github.sha }}
          path: ${{ runner.temp }}/tos-ci-executors
      - name: Verify and bind exact native CI executors
        env:
          TOS_CI_EXECUTOR_SHA256: ${{ needs.plan.outputs.executor_sha256 }}
          TOS_CI_MANIFEST_SHA256: ${{ needs.plan.outputs.executor_manifest_sha256 }}
        run: |
          root="$RUNNER_TEMP/tos-ci-executors"
          # Authenticate the verifier BEFORE executing downloaded code. These
          # digests come from the independent producer job, never its own manifest.
          printf '%s  %s\n' "$TOS_CI_EXECUTOR_SHA256" "$root/tos-software-ci" | sha256sum --check --status
          printf '%s  %s\n' "$TOS_CI_MANIFEST_SHA256" "$root/manifest.json" | sha256sum --check --status
          chmod 0500 "$root/tos-software-ci"
          "$root/tos-software-ci" executor-bind --repo-root "$GITHUB_WORKSPACE" \
            --artifact-root "$root" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
          chmod 0500 "$root/tos-release-check" "$root/tos-validation-lanes"
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: '"$TOS_SOFTWARE_CI_EXECUTOR" gate'
      - name: Fetch candidate after every selected check
        if: ${{ success() && needs.plan.outputs.software_mode != 'none' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tos-software-candidate-unqualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-software-candidate
      - name: Verify candidate against package job outputs
        if: ${{ success() && needs.plan.outputs.software_mode != 'none' }}
        env:
          CANDIDATE_SHA256: ${{ needs.software_package.outputs.candidate_sha256 }}
          CANDIDATE_SIDECAR_SHA256: ${{ needs.software_package.outputs.candidate_sidecar_sha256 }}
          CANDIDATE_BYTES: ${{ needs.software_package.outputs.candidate_bytes }}
          CANDIDATE_SIDECAR_BYTES: ${{ needs.software_package.outputs.candidate_sidecar_bytes }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const root = path.join(process.env.RUNNER_TEMP, 'qualified-software-candidate');
          const files = [['tree-of-sophia-software.zip', 'CANDIDATE'], ['tree-of-sophia-software.zip.manifest.json', 'CANDIDATE_SIDECAR']];
          assert.deepEqual(fs.readdirSync(root).sort(), files.map(([name]) => name).sort());
          for (const [name, prefix] of files) {
            const expected = process.env[`${prefix}_SHA256`], bytes = process.env[`${prefix}_BYTES`];
            assert.match(expected, /^[a-f0-9]{64}$/); assert.match(bytes, /^[1-9][0-9]*$/);
            const file = path.join(root, name), stat = fs.lstatSync(file);
            assert(stat.isFile() && !stat.isSymbolicLink()); assert.equal(stat.size, Number(bytes));
            const hash = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
            assert.equal(hash.digest('hex'), expected, `${name} differs from the admitted package job`);
          }
