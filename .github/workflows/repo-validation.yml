name: Repo Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks and validate changed documentation
    runs-on: ubuntu-latest
    outputs:
      software_mode: ${{ steps.select.outputs.software_mode }}
      worker: ${{ steps.select.outputs.worker }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Select checks from both sides of the exact change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL_RELEASE" = true ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python scripts/software_ci.py plan --base HEAD --full
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python scripts/software_ci.py plan --base "$BASE_SHA"
          fi

  software:
    needs: plan
    if: ${{ needs.plan.outputs.software_mode != 'none' }}
    name: Software Contracts, Browser and Installed Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout software and bounded test fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # Select complete implementation modules, not their current import graph.
        # Corpus inputs remain limited to contracts and named synthetic fixtures.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /access/
            !/access/web/dist/
            /scripts/
            /mechanics/growth-cycle/parts/branch-growth-cycle/scripts/
            /mechanics/growth-cycle/tests/test_source_revisions.py
            /docs/validation/validation_lanes.json
            /.gitignore
            /Cargo.toml
            /Cargo.lock
            /rust-toolchain.toml
            /rust/
            /tests/conformance/rust/
            /tests/test_validation_lanes.py
            /tests/test_acquisition_batch.py
            /tests/test_acquisition_handoff_adapter.py
            /tests/test_file_membership.py
            /tests/test_software_ci.py
            /tests/test_corpus_*.py
            /tests/test_local_stats_port.py
            /tests/test_build_kag_export.py
            /tests/test_downstream_status.py
            /tests/test_publish_kag_release.py
            /tests/test_publish_stats_release.py
            /kag/provider-template.json
            /mechanics/boundary-bridge/parts/derived-kag-seam/scripts/generate_kag_export.py
            /tests/test_source_catalog_projection.py
            /tests/test_source_catalog_slots.py
            /tests/test_native_text_binding.py
            /ToS/contracts/
            /ToS/doctrine/semantic-interchange/entity-types.v1.json
            /ToS/doctrine/semantic-interchange/relation-types.v1.json
            /ToS/doctrine/semantic-interchange/query-vocabulary.v1.json
            /ToS/candidate-intake/zarathustra/concept-workbench-v1/concept-request.v2.schema.json
            /ToS/candidate-intake/zarathustra/concept-workbench-v1/concept-search-result.v1.schema.json
            /ToS/candidate-intake/zarathustra/concept-workbench-v1/requests/fate.concept-request.v2.json
            /ToS/candidate-intake/zarathustra/reading-workbench-v1/reading-search-result.v1.schema.json
            /ToS/source-witnesses/works/tree-of-sophia/scoped-research-selection/expressions/english-20260910/editions/repository-82e7e281/items/acquired-note-utf8-20260910/item.json
            /ToS/source-witnesses/works/tree-of-sophia/scoped-research-selection/expressions/english-20260910/editions/repository-82e7e281/items/acquired-note-utf8-20260910/item.manifest.json
            /ToS/source-witnesses/works/tree-of-sophia/scoped-research-selection/expressions/english-20260910/editions/repository-82e7e281/items/acquired-note-utf8-20260910/rights.json
            /ToS/source-witnesses/works/tree-of-sophia/scoped-research-selection/expressions/english-20260910/editions/repository-82e7e281/items/acquired-note-utf8-20260910/provenance.jsonl
            /ToS/source-witnesses/works/friedrich-nietzsche/jenseits-von-gut-und-boese/expressions/de-naumann-1886/editions/leipzig-c-g-naumann-1886/items/internet-archive-google-harvard-scan-pdf/item.manifest.json
            /ToS/source-witnesses/works/friedrich-nietzsche/jenseits-von-gut-und-boese/expressions/de-naumann-1886/editions/leipzig-c-g-naumann-1886/items/internet-archive-google-harvard-scan-pdf/rights.json
            /ToS/canon/registries/predicates.csv
            /ToS/doctrine/semantic-interchange/entity-types.v1.json
            /ToS/doctrine/semantic-interchange/relation-types.v1.json
            /tests/fixtures/native-text-binding/
            /requirements-dev.txt
            /pytest.ini
            /.github/workflows/repo-validation.yml

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/web/package-lock.json

      - name: Install software test dependencies
        run: |
          python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2' 'playwright>=1.40'
          npm ci --prefer-offline --no-audit --no-fund --prefix access/web
          python -m playwright install --with-deps chromium

      - name: Prepare pinned native software and browser rules
        env:
          CARGO_HOME: ${{ runner.temp }}/software-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/software-cargo-target
          CARGO_BUILD_JOBS: "2"
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
          cargo build --locked -p tos-access --bin tos-access --target x86_64-unknown-linux-gnu
          cargo build --locked --release -p tos-web-rules --features wasm --target wasm32-unknown-unknown
          archive="$RUNNER_TEMP/software-wasm-bindgen.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-name tos_web_rules --out-dir access/deploy/cloudflare-worker/generated \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tos_web_rules.wasm"
          python - <<'PY_RECEIPT'
          import hashlib, json, os, subprocess
          from pathlib import Path
          binary = Path(os.environ['CARGO_TARGET_DIR']) / 'x86_64-unknown-linux-gnu/debug/tos-access'
          with binary.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          receipt = {'schema_version': 'tos_native_access_build_v1', 'sha256': digest,
                     'size_bytes': binary.stat().st_size, 'target': 'x86_64-unknown-linux-gnu',
                     'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
                     'toolchain': '1.98.1', 'profile': 'debug'}
          Path(os.environ['RUNNER_TEMP'], 'tos-native-build.json').write_text(json.dumps(receipt) + '\n')
          PY_RECEIPT

      - name: Validate software contracts and build browser assets
        run: python scripts/release_check.py --phase checks

      - name: Test shared software and data-operation code on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'full' }}
        run: python scripts/release_check.py --phase tests

      - name: Test reader and API behavior on fixtures
        if: ${{ needs.plan.outputs.software_mode == 'reader' }}
        run: python scripts/validation_lanes.py --run software_reader

      - name: Test browser behavior with bounded fixtures
        run: python scripts/validation_lanes.py --run software_browser

      - name: Build and install the native software artifact without corpus data
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/software-cargo-target
        run: |
          native="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/debug/tos-access"
          root="$GITHUB_WORKSPACE"
          archive="$root/dist/tree-of-sophia-software.zip"
          limits=(--max-total-bytes 536870912 --max-archive-bytes 553648128 --max-members 1024 --max-metadata-bytes 4194304)
          "$native" software build --root "$root" --source-ref "${{ github.sha }}" \
            --web-dist "$root/access/web/dist" --output "$archive" \
            --native-access-binary "$native" --native-access-receipt "$RUNNER_TEMP/tos-native-build.json" "${limits[@]}"
          "$native" software verify --archive "$archive" "${limits[@]}"
          "$native" software install --archive "$archive" --prefix "$RUNNER_TEMP/tos-native-install" "${limits[@]}"
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos" --help
          env -i PATH= "$RUNNER_TEMP/tos-native-install/bin/tos" --version

      - name: Retain unique legacy wheel and integrity reference checks
        run: |
          python access/packaging/build_software_bundle.py \
            --output "$RUNNER_TEMP/tree-of-sophia-legacy-reference.zip" \
            --source-ref "${{ github.sha }}"
          python access/packaging/validate_software_bundle.py --bundle "$RUNNER_TEMP/tree-of-sophia-legacy-reference.zip"

      - name: Preserve validated software candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-of-sophia-software-${{ github.sha }}
          path: |
            dist/tree-of-sophia-software.zip
            dist/tree-of-sophia-software.zip.manifest.json
          if-no-files-found: error
          retention-days: 14

  worker:
    needs: plan
    if: ${{ needs.plan.outputs.worker == 'true' }}
    name: Worker Software Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worker software
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # Keep the same owner implementation boundary as the Python software job.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /access/
            !/access/web/dist/
            /scripts/
            /mechanics/growth-cycle/parts/branch-growth-cycle/scripts/
            /mechanics/growth-cycle/tests/test_identity_proposals.py
            /mechanics/growth-cycle/tests/test_source_claim_commands.py
            /mechanics/growth-cycle/tests/test_source_commands.py
            /ToS/contracts/
            /ToS/canon/registries/predicates.csv
            /ToS/doctrine/semantic-interchange/entity-types.v1.json
            /ToS/doctrine/semantic-interchange/relation-types.v1.json
            /requirements-dev.txt

      - name: Setup Python for cross-adapter fixture checks
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          # Worker native-string ABI uses the CPython Unicode 16 tables.
          python-version: "3.14"

      - name: Install cross-adapter test dependencies
        run: python -m pip install -r requirements-dev.txt 'mcp>=1.27,<2'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: access/deploy/cloudflare-worker/package-lock.json

      - name: Test Worker contracts without deployment or production data
        run: |
          npm ci --prefer-offline --no-audit --no-fund --prefix access/deploy/cloudflare-worker
          npm run typecheck --prefix access/deploy/cloudflare-worker
          npm test --prefix access/deploy/cloudflare-worker

  rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: Rust Workspace, Reader and WebAssembly Host
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: tos_cmd_lab
          POSTGRES_USER: tos_cmd_lab
          POSTGRES_PASSWORD: synthetic_lab_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tos_cmd_lab -d tos_cmd_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Rust sources and validation route
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /rust-toolchain.toml
            /rust/
            /tests/conformance/rust/
            /access/tests/fixtures/knowledge-contract/temporal-jenseits-date.json
            /access/src/
            /ToS/contracts/
            /scripts/validation_lanes.py
            /scripts/verify_rust_reader_install.py
            /scripts/verify_rust_mechanics_install.py
            /scripts/run_mechanics_local_tests.py
            /ToS/doctrine/semantic-interchange/
            /ToS/source-witnesses/works/friedrich-nietzsche/also-sprach-zarathustra/expressions/de-schmeitzner-1884-part-3/editions/chemnitz-schmeitzner-1884-part-3/edition.json
            /ToS/source-witnesses/works/friedrich-nietzsche/also-sprach-zarathustra/expressions/de-schmeitzner-1884-part-3/editions/chemnitz-schmeitzner-1884-part-3/items/dta-sbb-corrected-tei-p5/
            !/ToS/source-witnesses/**/payload/
            /ToS/research-packets/foundation-laboratory-2026-07/DTA_ZARATHUSTRA_PARTS_1_4_LAYERED_RIGHTS_ASSESSMENT.md
            /ToS/research-packets/foundation-laboratory-2026-07/provenance-event-v2-abc/
            /ToS/research-packets/retained-builder-inputs/build_provenance_event_v2_lab/
            /scripts/verify_rust_web_host.py
            /docs/validation/validation_lanes.json
      - name: Setup Python for Unicode 16 differential oracles
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Setup Node for generated WebAssembly host
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install verified wasm-bindgen CLI
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify Rust workspace and isolated install
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          CARGO_BUILD_JOBS: "2"
        run: python scripts/validation_lanes.py --run rust_workspace
      - name: Verify durable command transactions against PostgreSQL
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          CARGO_BUILD_JOBS: "2"
          TOS_CMD_POSTGRES_URL: postgres://tos_cmd_lab:synthetic_lab_only@127.0.0.1:5432/tos_cmd_lab
        run: |
          : "${TOS_CMD_POSTGRES_URL:?dedicated PostgreSQL connection is required}"
          cargo test -p tos-command --features postgres-lab --test postgres_durable_lab --locked -- --nocapture

  required_gate:
    name: Repo Validation
    if: ${{ always() }}
    needs: [plan, software, worker, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: scripts
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/software_ci.py gate
