# INERT SOURCE PROPOSAL. No execution selection or remote ref exists for these objects.
name: ToS Public Source Identity Witness
on:
  workflow_call:
    inputs:
      expected_producer:
        type: string
        required: true
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify ordinary immutable launch binding
        env:
          TOS_EXPECTED_PRODUCER: ${{ inputs.expected_producer }}
          TOS_CALLER: ${{ github.sha }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUN_ATTEMPT: ${{ github.run_attempt }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          export TOS_PRE_SUDO_IMAGEVERSION="${ImageVersion-}"
          /usr/bin/python3 -I -S - <<'ORDINARY'
          """Platform identity predicate only; external exact-object selection remains authority."""
          import re
          
          REPOSITORY = '8Dionysus/Tree-of-Sophia'
          PRODUCER = '.github/workflows/tos-source-witness-producer.yml'
          CALLER = '.github/workflows/tos-source-witness-caller.yml'
          PREFIX = 'codex/tos-item-source-witness-'
          
          
          def checked_binding(values):
              producer = values.get('TOS_EXPECTED_PRODUCER', '')
              caller = values.get('TOS_CALLER', '')
              if not isinstance(producer, str) or not isinstance(caller, str) or not re.fullmatch(
                      '[0-9a-f]{40}', producer) or not re.fullmatch('[0-9a-f]{40}', caller):
                  raise ValueError('source-identity')
              ref = 'refs/heads/' + PREFIX + caller
              expected = {
                  'TOS_REPOSITORY': REPOSITORY, 'TOS_EVENT': 'push', 'TOS_REF': ref,
                  'TOS_WORKFLOW_SHA': caller,
                  'TOS_WORKFLOW_REF': REPOSITORY + '/' + CALLER + '@' + ref,
                  'TOS_PRODUCER_SHA': producer,
                  'TOS_PRODUCER_REF': REPOSITORY + '/' + PRODUCER + '@' + producer,
                  'TOS_PRODUCER_REPOSITORY': REPOSITORY,
                  'TOS_RUN_ATTEMPT': '1', 'TOS_RUNNER_ENVIRONMENT': 'github-hosted',
                  'TOS_RUNNER_OS': 'Linux', 'TOS_RUNNER_ARCH': 'X64', 'ImageOS': 'ubuntu24',
              }
              if any(values.get(k) != v for k, v in expected.items()):
                  raise ValueError('platform-binding')
              versions = {}
              for key in ('ImageVersion', 'TOS_PRE_SUDO_IMAGEVERSION'):
                  value = values.get(key)
                  if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', value):
                      raise ValueError('image-version-metadata')
                  versions[key] = value
              if versions['ImageVersion'] != versions['TOS_PRE_SUDO_IMAGEVERSION']:
                  raise ValueError('sudo-environment-drift')
              return {'platform_binding': 'coherent', 'producer_commit': producer,
                      'caller_commit': caller, 'activation_ref': ref, 'attempt': 1,
                      'post_sudo_ImageVersion': versions['ImageVersion'],
                      'reported_pre_sudo_ImageVersion': versions['TOS_PRE_SUDO_IMAGEVERSION'],
                      'image_origin_proven': False,
                      'authority': 'external exact producer/caller/ref selection; never this record'}
          import os
          checked_binding(os.environ)
          print('Ordinary source/platform binding coherent; external selection separate.')
          ORDINARY
      - name: Read only the bounded selected metadata
        env:
          TOS_EXPECTED_PRODUCER: ${{ inputs.expected_producer }}
          TOS_CALLER: ${{ github.sha }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUN_ATTEMPT: ${{ github.run_attempt }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          export TOS_PRE_SUDO_IMAGEVERSION="${ImageVersion-}"
          set +e
          sudo -n --preserve-env=ImageOS,ImageVersion,TOS_PRE_SUDO_IMAGEVERSION,TOS_EXPECTED_PRODUCER,TOS_CALLER,TOS_REPOSITORY,TOS_EVENT,TOS_REF,TOS_WORKFLOW_SHA,TOS_WORKFLOW_REF,TOS_PRODUCER_SHA,TOS_PRODUCER_REF,TOS_PRODUCER_REPOSITORY,TOS_RUN_ATTEMPT,TOS_RUNNER_ENVIRONMENT,TOS_RUNNER_OS,TOS_RUNNER_ARCH \
            /usr/bin/python3 -I -S - > "$RUNNER_TEMP/tos-source-witness.json" \
            2> "$RUNNER_TEMP/tos-source-witness.pin" <<'IMMUTABLE'
          """Pure bounded decoding of immutable embedded bytes; no IO or execution."""
          import base64
          import hashlib
          import json
          import zlib


          def unpack_candidate(encoded, expected_sha256):
              if not isinstance(encoded, str) or len(encoded) > 350000:
                  raise ValueError('packed-bound')
              packed = base64.b64decode(encoded, validate=True)
              d = zlib.decompressobj()
              raw = d.decompress(packed, 262144)
              if not d.eof or d.unused_data or d.unconsumed_tail:
                  raise ValueError('payload-bound')
              if hashlib.sha256(raw).hexdigest() != expected_sha256:
                  raise ValueError('payload-hash')
              value = json.loads(raw)
              if not isinstance(value, dict) or set(value) != {'binding', 'collector', 'scope'}:
                  raise ValueError('payload-shape')
              if not all(isinstance(v, str) for v in value.values()):
                  raise ValueError('payload-type')
              return value

          """Pure fixed-status codec. No filesystem, clocks, exception text or subprocess."""
          STATUS_RESERVE = 512
          STATUS_LINE_CAP = 192
          REFUSAL_CODES = {
              "bad-field-cap": 20,
              "bad-limit": 21,
              "conditional-drift": 22,
              "config-drift": 23,
              "custody": 24,
              "deadline": 25,
              "declared-size": 26,
              "descriptor-cleanup": 27,
              "directory-cache-binding": 28,
              "directory-cache-drift": 29,
              "directory-child-unreviewed": 30,
              "directory-count": 31,
              "directory-descriptor-cap": 32,
              "directory-drift": 33,
              "directory-duplicate": 34,
              "directory-header": 35,
              "directory-membership": 36,
              "directory-record": 37,
              "empty-local-drift": 38,
              "encoding": 39,
              "entry-name": 40,
              "executable-drift": 41,
              "executable-hash": 42,
              "existing-timer": 43,
              "feature-path": 44,
              "feature-total": 45,
              "feature-value": 46,
              "features-drift": 47,
              "features-empty": 48,
              "field-budget": 49,
              "held-executable-cap": 50,
              "held-file-drift": 51,
              "input-budget": 52,
              "link-encoding": 53,
              "link-size": 54,
              "mandatory-absent": 55,
              "metadata-type": 56,
              "named-directory-drift": 57,
              "named-file-drift": 58,
              "native-abi": 59,
              "native-buffer": 60,
              "native-return": 61,
              "operation-budget": 62,
              "output-budget": 63,
              "path-shape": 64,
              "policy-inventory-drift": 65,
              "policy-revision-drift": 66,
              "private-local-nonempty": 67,
              "profile-count": 68,
              "profile-link-directory-forbidden": 69,
              "profile-link-type": 70,
              "profile-sha": 71,
              "profile-sha-missing": 72,
              "raw-abi": 73,
              "raw-alias-drift": 74,
              "raw-directory-forbidden": 75,
              "raw-endpoint-drift": 76,
              "raw-link": 77,
              "raw-link-escape": 78,
              "raw-link-layout": 80,
              "raw-metadata-drift": 81,
              "raw-open-forbidden": 82,
              "raw-selector": 83,
              "raw-selector-set": 84,
              "raw-size-unavailable": 85,
              "reader-contract": 86,
              "revision": 87,
              "selected-context": 88,
              "source-drift": 89,
              "source-hash": 90,
              "total-output-budget": 91,
              "tree-depth": 92,
              "tree-directories": 93,
              "tree-files": 94,
              "tree-link": 95,
              "type": 96,
              "unreviewed-directory": 97,
              "writer-contract": 98
          }
          EARLY = {
              3: ('entry','selected-context','not-entered'),
              4: ('payload','packed-bound','not-entered'),
              5: ('payload','payload-bound','not-entered'),
              6: ('payload','payload-hash','not-entered'),
              7: ('payload','payload-shape','not-entered'),
              8: ('payload','payload-type','not-entered'),
              9: ('payload','untyped-failure','not-entered'),
              10: ('binding','source-identity','not-entered'),
              11: ('binding','platform-binding','not-entered'),
              12: ('binding','image-version-metadata','not-entered'),
              13: ('binding','sudo-environment-drift','not-entered'),
              14: ('binding','untyped-failure','not-entered'),
              15: ('collector-load','untyped-failure','not-entered'),
              16: ('collector-call','untyped-failure','unknown'),
              17: ('driver','untyped-failure','unknown'),
          }
          PAYLOAD_CODES = {'packed-bound':4,'payload-bound':5,'payload-hash':6,'payload-shape':7,'payload-type':8}
          BINDING_CODES = {'source-identity':10,'platform-binding':11,'image-version-metadata':12,'sudo-environment-drift':13}


          def literal_value_error(exc, table, fallback):
              if type(exc) is ValueError and len(exc.args)==1 and type(exc.args[0]) is str:
                  return table.get(exc.args[0],fallback)
              return fallback


          def refusal_exit(exc, refusal_type):
              if type(exc) is refusal_type and len(exc.args)==1 and type(exc.args[0]) is str:
                  return REFUSAL_CODES.get(exc.args[0],100)
              if isinstance(exc,OSError):
                  return 99
              return 100


          def cleanup_exit(primary, mask):
              #mask bits1/2/4 mean descriptor-close/disarm/handler-restore failure.
              #A cleanup failure deliberately overrides the primary reason; do not infer it.
              if type(mask) is not int or not 0<=mask<=7:
                  return 100
              return 109+mask if mask else primary


          def status_record(raw):
              code = None
              if type(raw) is str and 1<=len(raw)<=3 and raw.isascii() and raw.isdecimal():
                  value = int(raw)
                  if 0<=value<=255 and str(value)==raw:
                      code = value
              shown = str(code) if code is not None else 'unknown'
              if code==79:
                  phase,reason,cleanup = 'complete','none','outer-ok'
              elif code in EARLY:
                  phase,reason,cleanup = EARLY[code]
              elif code in REFUSAL_CODES.values():
                  phase,reason,cleanup = 'collector',next(k for k,v in REFUSAL_CODES.items() if v==code),'outer-ok'
              elif code in (99,100):
                  phase,reason,cleanup = 'collector',('os-error' if code==99 else 'untyped-failure'),'outer-ok'
              elif code is not None and 110<=code<=116:
                  phase,cleanup = 'cleanup','outer-failed'
                  reason = ('fs' if (code-109)&1 else '') + ('-timer' if (code-109)&2 else '') + ('-handler' if (code-109)&4 else '')
                  reason = reason.lstrip('-')
              else:
                  phase,reason,cleanup = 'transport','untyped-or-abrupt','unknown'
              line = ('TOS_WITNESS_STATUS_V1 child='+shown+' phase='+phase+' reason='+reason+' cleanup='+cleanup+'\n').encode('ascii')
              if len(line)>STATUS_LINE_CAP:
                  raise ValueError('fixed-status-bound')
              return line


          def wrapper_unverified_record():
              return b'TOS_WITNESS_STATUS_V1 child=79 phase=wrapper reason=output-unverified cleanup=outer-ok\n'

          import os,sys
          def selected_entry():
              if not sys.flags.isolated or not sys.flags.no_site or os.geteuid()!=0:
                  return 3
              try:
                  p=unpack_candidate('', 'efdfbe9b316ba069406d37f4d42742a12fe4c0220d17629c901cf310069c1aaf')
              except BaseException as exc:
                  return literal_value_error(exc,PAYLOAD_CODES,9)
              binding_scope={'__name__':'_immutable_binding'}
              try:
                  exec(compile(p['binding'],'<immutable-binding>','exec'),binding_scope)
                  binding=binding_scope['checked_binding'](os.environ)
              except BaseException as exc:
                  return literal_value_error(exc,BINDING_CODES,14)
              collector_scope={'__name__':'_immutable_source_witness'}
              try:
                  scope=json.loads(p['scope'])
                  exec(compile(p['collector'],'<immutable-source-witness>','exec'),collector_scope)
              except BaseException:
                  return 15
              try:
                  return collector_scope['run_selected'](scope,binding)
              except BaseException:
                  return 16
          try:
              result=selected_entry()
          except BaseException:
              result=17
          raise SystemExit(result)
          IMMUTABLE
          code=$?
          set -e
          /usr/bin/python3 -I -S - "$code" "$RUNNER_TEMP/tos-source-witness.json" "$RUNNER_TEMP/tos-source-witness.pin" <<'VERIFY'
          """Pure fixed-status codec. No filesystem, clocks, exception text or subprocess."""
          STATUS_RESERVE = 512
          STATUS_LINE_CAP = 192
          REFUSAL_CODES = {
              "bad-field-cap": 20,
