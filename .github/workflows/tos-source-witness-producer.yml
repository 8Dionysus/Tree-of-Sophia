# INERT SOURCE PROPOSAL. No execution selection or remote ref exists for these objects.
name: ToS Public Source Identity Witness
on:
  workflow_call:
    inputs:
      expected_producer:
        type: string
        required: true
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify ordinary immutable launch binding
        env:
          TOS_EXPECTED_PRODUCER: ${{ inputs.expected_producer }}
          TOS_CALLER: ${{ github.sha }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUN_ATTEMPT: ${{ github.run_attempt }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          export TOS_PRE_SUDO_IMAGEVERSION="${ImageVersion-}"
          /usr/bin/python3 -I -S - <<'ORDINARY'
          """Platform identity predicate only; external exact-object selection remains authority."""
          import re
          
          REPOSITORY = '8Dionysus/Tree-of-Sophia'
          PRODUCER = '.github/workflows/tos-source-witness-producer.yml'
          CALLER = '.github/workflows/tos-source-witness-caller.yml'
          PREFIX = 'codex/tos-item-source-witness-'
          
          
          def checked_binding(values):
              producer = values.get('TOS_EXPECTED_PRODUCER', '')
              caller = values.get('TOS_CALLER', '')
              if not isinstance(producer, str) or not isinstance(caller, str) or not re.fullmatch(
                      '[0-9a-f]{40}', producer) or not re.fullmatch('[0-9a-f]{40}', caller):
                  raise ValueError('source-identity')
              ref = 'refs/heads/' + PREFIX + caller
              expected = {
                  'TOS_REPOSITORY': REPOSITORY, 'TOS_EVENT': 'push', 'TOS_REF': ref,
                  'TOS_WORKFLOW_SHA': caller,
                  'TOS_WORKFLOW_REF': REPOSITORY + '/' + CALLER + '@' + ref,
                  'TOS_PRODUCER_SHA': producer,
                  'TOS_PRODUCER_REF': REPOSITORY + '/' + PRODUCER + '@' + producer,
                  'TOS_PRODUCER_REPOSITORY': REPOSITORY,
                  'TOS_RUN_ATTEMPT': '1', 'TOS_RUNNER_ENVIRONMENT': 'github-hosted',
                  'TOS_RUNNER_OS': 'Linux', 'TOS_RUNNER_ARCH': 'X64', 'ImageOS': 'ubuntu24',
              }
              if any(values.get(k) != v for k, v in expected.items()):
                  raise ValueError('platform-binding')
              versions = {}
              for key in ('ImageVersion', 'TOS_PRE_SUDO_IMAGEVERSION'):
                  value = values.get(key)
                  if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', value):
                      raise ValueError('image-version-metadata')
                  versions[key] = value
              if versions['ImageVersion'] != versions['TOS_PRE_SUDO_IMAGEVERSION']:
                  raise ValueError('sudo-environment-drift')
              return {'platform_binding': 'coherent', 'producer_commit': producer,
                      'caller_commit': caller, 'activation_ref': ref, 'attempt': 1,
                      'post_sudo_ImageVersion': versions['ImageVersion'],
                      'reported_pre_sudo_ImageVersion': versions['TOS_PRE_SUDO_IMAGEVERSION'],
                      'image_origin_proven': False,
                      'authority': 'external exact producer/caller/ref selection; never this record'}
          import os
          checked_binding(os.environ)
          print('Ordinary source/platform binding coherent; external selection separate.')
          ORDINARY
      - name: Read only the bounded selected metadata
        env:
          TOS_EXPECTED_PRODUCER: ${{ inputs.expected_producer }}
          TOS_CALLER: ${{ github.sha }}
          TOS_REPOSITORY: ${{ github.repository }}
          TOS_EVENT: ${{ github.event_name }}
          TOS_REF: ${{ github.ref }}
          TOS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TOS_WORKFLOW_REF: ${{ github.workflow_ref }}
          TOS_PRODUCER_SHA: ${{ job.workflow_sha }}
          TOS_PRODUCER_REF: ${{ job.workflow_ref }}
          TOS_PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          TOS_RUN_ATTEMPT: ${{ github.run_attempt }}
          TOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOS_RUNNER_OS: ${{ runner.os }}
          TOS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          export TOS_PRE_SUDO_IMAGEVERSION="${ImageVersion-}"
          set +e
          sudo -n --preserve-env=ImageOS,ImageVersion,TOS_PRE_SUDO_IMAGEVERSION,TOS_EXPECTED_PRODUCER,TOS_CALLER,TOS_REPOSITORY,TOS_EVENT,TOS_REF,TOS_WORKFLOW_SHA,TOS_WORKFLOW_REF,TOS_PRODUCER_SHA,TOS_PRODUCER_REF,TOS_PRODUCER_REPOSITORY,TOS_RUN_ATTEMPT,TOS_RUNNER_ENVIRONMENT,TOS_RUNNER_OS,TOS_RUNNER_ARCH \
            /usr/bin/python3 -I -S - > "$RUNNER_TEMP/tos-source-witness.json" \
            2> "$RUNNER_TEMP/tos-source-witness.pin" <<'IMMUTABLE'
          """Pure bounded decoding of immutable embedded bytes; no IO or execution."""
          import base64
          import hashlib
          import json
          import zlib
          
          
          def unpack_candidate(encoded, expected_sha256):
              if not isinstance(encoded, str) or len(encoded) > 350000:
                  raise ValueError('packed-bound')
              packed = base64.b64decode(encoded, validate=True)
              d = zlib.decompressobj()
              raw = d.decompress(packed, 262144)
              if not d.eof or d.unused_data or d.unconsumed_tail:
                  raise ValueError('payload-bound')
              if hashlib.sha256(raw).hexdigest() != expected_sha256:
                  raise ValueError('payload-hash')
              value = json.loads(raw)
              if not isinstance(value, dict) or set(value) != {'binding', 'collector', 'scope'}:
                  raise ValueError('payload-shape')
              if not all(isinstance(v, str) for v in value.values()):
                  raise ValueError('payload-type')
              return value
          
          import os,sys
          if not sys.flags.isolated or not sys.flags.no_site or os.geteuid()!=0:
              raise SystemExit(1)
          try:
              p=unpack_candidate('','9fd2918be875968618b81f4571999da5ac145fc13c7210f6b50d66efa2fdc1f2')
          except Exception:
              raise SystemExit(1)
          binding_scope={'__name__':'_immutable_binding'}
          exec(compile(p['binding'],'<immutable-binding>','exec'),binding_scope)
          try:
              binding=binding_scope['checked_binding'](os.environ)
          except Exception:
              raise SystemExit(1)
          scope=json.loads(p['scope'])
          collector_scope={'__name__':'_immutable_source_witness'}
          exec(compile(p['collector'],'<immutable-source-witness>','exec'),collector_scope)
          raise SystemExit(collector_scope['run_selected'](scope,binding))
          IMMUTABLE
          code=$?
          set -e
          /usr/bin/python3 -I -S - "$code" "$RUNNER_TEMP/tos-source-witness.json" "$RUNNER_TEMP/tos-source-witness.pin" <<'VERIFY'
          import hashlib,json,re,sys
          assert sys.argv[1]=='79'
          with open(sys.argv[3],'rb') as f: pin=f.read(257)
          assert len(pin)<=256
          m=re.fullmatch(rb'TOS_SOURCE_WITNESS_SHA256 ([0-9a-f]{64}) bytes=([0-9]+)\n',pin)
          assert m
          with open(sys.argv[2],'rb') as f: wire=f.read(524289)
          assert len(wire)+len(pin)<=524288
          assert len(wire)==int(m[2]) and hashlib.sha256(wire).hexdigest()==m[1].decode()
          v=json.loads(wire)
          assert v['outcome']=='diagnostic-only' and v['diagnostic_exit_code']==79
          assert len(v['sources'])==144 and len(v['conditional_inputs'])==142 and len(v['raw_endpoint_sizes'])==97
          for k in ('source_closure_proven','attachment_admission','ticket_issued','namespace_attempted','policy_changed','source_contents_exported','raw_data_opened'):
              assert v[k] is False
          assert v['compiled_stream_matches']==0 and v['operational_status']=='NOTRUN'
          assert v['binding']['platform_binding']=='coherent' and v['binding']['attempt']==1
          print(pin.decode(),end='')
          print('Diagnostic identity witness only. ItemPG NOTRUN.')
          VERIFY
      - name: Preserve reviewed metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tos-source-witness-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/tos-source-witness.json
            ${{ runner.temp }}/tos-source-witness.pin
      - name: Cleanup owned temporary outputs
        if: always()
        run: |
          /usr/bin/python3 -I -S - <<'CLEANUP'
          import os
          root=os.environ['RUNNER_TEMP']
          assert os.path.isabs(root)
          for name in ('tos-source-witness.json','tos-source-witness.pin'):
              try: os.unlink(os.path.join(root,name))
              except FileNotFoundError: pass
          CLEANUP
      - name: Operational gate remains closed
        if: always()
        run: exit 125
