name: Historical Source-Side Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Budget receipts bind admission to an exact historical base_ref.
          # Keep that owner evidence locally verifiable for the smoke lane.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build native source validators
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/source-audit-target
          CARGO_BUILD_JOBS: "2"
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked -p tos-ops-mechanics-plan --bin tos-ops-mechanics-plan
          echo "$CARGO_TARGET_DIR/debug" >> "$GITHUB_PATH"

      - name: Run tiny-entry validator
        run: tos-ops-mechanics-plan --repo-root "$GITHUB_WORKSPACE" --tiny-entry-validate

      - name: Check native KAG export and publication contracts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/source-audit-target
          CARGO_BUILD_JOBS: "2"
        run: cargo +1.98.1 test --locked -p tos-ops-mechanics-plan --lib kag_corpus_export::tests -- --test-threads=1

      - name: Run tree-node contract validator
        run: tos-ops-mechanics-plan --repo-root "$GITHUB_WORKSPACE" --tree-node-validate

      - name: Run relation-pack validator
        run: tos-ops-mechanics-plan --repo-root "$GITHUB_WORKSPACE" --relation-pack-validate

      - name: Run public example sync validator
        run: tos-ops-mechanics-plan --repo-root "$GITHUB_WORKSPACE" --public-mirror-validate

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider --durations=20 tests
