name: Historical Source-to-edge Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Source-to-edge contract
    runs-on: ubuntu-latest
    # The current full-corpus run reached the bounded 90-minute budget while
    # Build and check Worker was still running; downstream import, contract,
    # and dry-run correctness therefore remain unverified. Give this complete
    # build a bounded 120-minute budget; every validation step remains required.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: access/deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            access/web/package-lock.json
            access/deploy/cloudflare-worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci && npm run ci:python && npm run ci:web
      - name: Build and check Worker
        run: npm run check
      - name: Import local D1 read model
        run: npm run load:local > "$RUNNER_TEMP/tos-d1-import.log"
      - name: Verify Python-to-Worker contract
        run: npm run verify:local
      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run --outdir="$RUNNER_TEMP/tos-worker-dry-run"
