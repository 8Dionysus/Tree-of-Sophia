name: Cloudflare Edge

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-edge.yml"
      - "access/**"
      - "ToS/derived-exports/tos_corpus_index.min.json"
      - "ToS/derived-exports/philosophy_graph_projection.min.json"
      - "ToS/derived-exports/epistemic_evidence_projection.min.json"
      - "ToS/philosophy/graph-workbench/review-packets/table-i-post-planting-audit.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-edge.yml"
      - "access/**"
      - "ToS/derived-exports/tos_corpus_index.min.json"
      - "ToS/derived-exports/philosophy_graph_projection.min.json"
      - "ToS/derived-exports/epistemic_evidence_projection.min.json"
      - "ToS/philosophy/graph-workbench/review-packets/table-i-post-planting-audit.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Source-to-edge contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: access/deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            access/web/package-lock.json
            access/deploy/cloudflare-worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci && npm run ci:python && npm run ci:web
      - name: Build and check Worker
        run: npm run check
      - name: Import local D1 read model
        run: npm run load:local > "$RUNNER_TEMP/tos-d1-import.log"
      - name: Verify Python-to-Worker contract
        run: npm run verify:local
      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run --outdir="$RUNNER_TEMP/tos-worker-dry-run"
