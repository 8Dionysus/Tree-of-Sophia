<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Читалка ToS — проверка масштаба</title></head>
<body>
<main id="tree"></main>
<aside class="corpus-fixture-controls" aria-label="Проверочные условия">

  <button id="corpus-check-scale">100 переходов</button>

  <output id="corpus-metrics" aria-live="polite"></output>
</aside>
