[package]
name = "tos-conformance"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde_json = "1"
tempfile = "3"
tos-command = { path = "../../../rust/crates/tos-command" }
tos-compiler = { path = "../../../rust/crates/tos-compiler", features = ["test-fixture"] }
tos-query = { path = "../../../rust/crates/tos-query" }
tos-access = { path = "../../../rust/crates/tos-access" }
tos-validation = { path = "../../../rust/crates/tos-validation" }
tos-foundation = { path = "../../../rust/crates/tos-foundation" }
tos-source-store = { path = "../../../rust/crates/tos-source-store" }
tos-segment-store = { path = "../../../rust/crates/tos-segment-store" }

[[test]]
name = "conformance"
path = "runner.rs"

[[test]]
name = "segment-conformance"
path = "segment_runner.rs"
